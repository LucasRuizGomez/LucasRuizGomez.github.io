# Builds Hollow Crypt (C++ -> WebAssembly) and the Astro portfolio, runs their checks,
# and publishes the whole site to GitHub Pages.
# Needs Settings -> Pages -> Build and deployment -> Source set to "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: 7.0.0   # keep in step with the SDK used locally (rpg/README.md)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      # apt mirrors sometimes fail on the runners; PyPI carries Ninja too, so fall back to it
      - name: Install Ninja
        run: |
          if ! (sudo apt-get update && sudo apt-get install -y ninja-build); then
            pip install --user ninja
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure
        working-directory: rpg
        run: cmake --preset web-release -DHC_WARNINGS_AS_ERRORS=ON

      - name: Build
        working-directory: rpg
        run: cmake --build --preset web-release

      - name: Test
        working-directory: rpg
        run: ctest --preset web-release

      # The portfolio pages (/, /resume, 404) are an Astro site in site/.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the portfolio
        working-directory: site
        run: |
          npm ci
          npm run check
          npm run check:contrast
          npm run build

      # The site is the repository as it is, with rpg/ replaced by the compiled game
      # and the Astro build laid over the root.
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site --exclude emsdk-cache --exclude rpg --exclude site ./ _site/
          mkdir _site/rpg
          cp -r rpg/build/web-release/dist/. _site/rpg/
          cp -r site/dist/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
