<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch C1 · Wortschatz</title>
<meta name="description" content="Spaced-repetition flashcards for C1 German vocabulary.">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wortschatz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc;
    --blue:#2f6fde; --red:#d4443b; --green:#2e9d5b; --amber:#c98a12;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
    --serif:"Source Serif 4",Georgia,serif; --sans:Inter,system-ui,sans-serif;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#161618;--panel:#1f1f22;--ink:#ececee;--muted:#9a9aa1;--line:#2e2e33;
      --blue:#6b9cff;--red:#ff6b61;--green:#4fc47f;--amber:#e6a93a;--shadow:0 8px 28px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
  h1{font:600 18px/1.2 var(--sans);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h1 span{color:var(--muted);font-weight:500}
  .decksel{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 8px;font-size:13px;max-width:190px}
  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:0;background:none;color:var(--muted);font:500 13px var(--sans);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--bg);color:var(--ink)}
  .counts{display:flex;justify-content:center;gap:22px;font:600 15px var(--sans);margin:6px 0 14px;font-variant-numeric:tabular-nums}
  .counts .n{color:var(--blue)} .counts .l{color:var(--red)} .counts .d{color:var(--green)}
  .counts small{display:block;font:500 11px var(--sans);color:var(--muted);text-align:center;letter-spacing:.04em;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:340px;padding:28px 28px 24px;display:flex;flex-direction:column;touch-action:pan-y}
  .card.tap{cursor:pointer}
  .dir{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
  .front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 0 10px}
  .word{font:600 38px/1.15 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
  .word.en{font-size:30px}
  .hint{color:var(--muted);margin-top:8px;font-size:14px}
  .back{border-top:1px solid var(--line);margin-top:8px;padding-top:18px;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .answer{font:600 26px/1.25 var(--serif);text-align:center;margin-bottom:14px}
  .row{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:6px 0;font-size:14.5px}
  .row b{font:500 11px/2 var(--sans);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .ex{font-family:var(--serif);font-size:16.5px}
  .ex i{display:block;color:var(--muted);font:400 13.5px var(--sans);font-style:normal;margin-top:2px}
  .spk{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;width:30px;height:30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:8px;padding:0}
  .spk svg{width:14px;height:14px}
  .spk.on{color:var(--blue);border-color:var(--blue)}
  .actions{margin-top:16px}
  .show{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 15px var(--sans);cursor:pointer;box-shadow:var(--shadow)}
  .show:hover{border-color:var(--muted)}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grades button{padding:10px 6px 9px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:600 14px var(--sans);color:var(--ink);box-shadow:var(--shadow)}
  .grades button small{display:block;font:500 11.5px var(--sans);color:var(--muted);margin-top:2px}
  .grades .g1{border-bottom:3px solid var(--red)} .grades .g2{border-bottom:3px solid var(--amber)}
  .grades .g3{border-bottom:3px solid var(--green)} .grades .g4{border-bottom:3px solid var(--blue)}
  .kbd{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty h2{color:var(--ink);font:600 22px var(--serif);margin:0 0 6px}
  .empty button{margin-top:16px}
  .btn2{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13.5px var(--sans);cursor:pointer}
  .btn2:hover{border-color:var(--muted)}
  .btn2:disabled{opacity:.5;cursor:default}
  .btn1{padding:10px 18px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;font:600 14px var(--sans);cursor:pointer}
  .btn1:disabled{opacity:.5;cursor:default}
  .danger{color:var(--red)}
  .note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px;min-height:18px}
  .note.err{color:var(--red)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);user-select:none;white-space:nowrap}
  th[data-s]{cursor:pointer} th.sorted{color:var(--ink)}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer} tbody tr:hover td{background:color-mix(in srgb,var(--bg) 60%,transparent)}
  tr.editing td{background:var(--bg);cursor:default}
  td.de{font-family:var(--serif);font-size:15.5px;font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td small{display:block;color:var(--muted);font-size:12px}
  .pill{display:inline-block;font:500 11.5px var(--sans);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .pill.new{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
  .pill.learn{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
  .pill.rev{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
  .pill.warn{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
  .deckhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
  .cram{display:inline-block;font:500 11px var(--sans);color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
  .panel+.panel{margin-top:14px}
  .panel h2{font:600 15px var(--sans);margin:0 0 4px}
  .panel p.help{color:var(--muted);font-size:13px;margin:0 0 12px}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
  .field input,.field select,.field textarea,input.search,textarea.big{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:14px;color:var(--ink);font-weight:400;width:100%}
  .field textarea{resize:vertical;min-height:38px}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  textarea.big{min-height:180px;resize:vertical;font-family:var(--sans);line-height:1.5}
  input.search{max-width:260px;background:var(--panel)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .bar .grow{flex:1}
  .draft{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
  .draft+.draft{margin-top:10px}
  .draft.off{opacity:.55}
  .draft .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .draft .top label{display:flex;align-items:center;gap:6px;font-weight:600;font-family:var(--serif);font-size:17px}
  .draft .flagnote{font-size:12.5px;color:var(--amber);margin:-4px 0 10px}
  .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px}
  .decklist .item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .decklist .item:last-child{border-bottom:0}
  .decklist .name{font-weight:600;flex:1;min-width:140px}
  .decklist .name small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .mini{display:flex;gap:10px;font:600 13px var(--sans);font-variant-numeric:tabular-nums}
  .mini .n{color:var(--blue)} .mini .l{color:var(--red)} .mini .d{color:var(--green)}
  .editor{display:grid;gap:10px;padding:4px 0}
  .muted{color:var(--muted)}
  .sync{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--muted);display:none;z-index:5}
  .sync.on{display:block}
  .login{max-width:380px;margin:40px auto}
  @media (max-width:520px){
    .word{font-size:32px}.card{padding:22px 18px;min-height:300px}.row{grid-template-columns:1fr;gap:0}.grades button{font-size:13px}
    .grid2,.grid4{grid-template-columns:1fr 1fr}
    .grid4 .field:first-child{grid-column:1/-1}
    .decksel{max-width:150px}
    /* big answer buttons pinned to the bottom on phones */
    body.studying .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
    body.studying .actions{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:4}
    body.studying .actions .grades button{padding:14px 4px 12px}
    body.studying .actions .kbd{display:none}
    body.studying .sync{bottom:calc(96px + env(safe-area-inset-bottom))}
    th.hide-sm,td.hide-sm{display:none}
  }
  @media (prefers-reduced-motion:reduce){.back{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1 id="title">Deutsch C1 <span>· Wortschatz</span></h1></div>
    <select id="deckSel" class="decksel" aria-label="Deck" hidden></select>
    <nav class="tabs" id="tabs" hidden>
      <button data-v="study" class="on">Study</button><button data-v="deck">Deck</button><button data-v="add">Add words</button><button data-v="decks">Decks</button><button data-v="settings">Settings</button>
    </nav>
  </header>
  <main id="app"><div class="empty">Loading deck…</div></main>
  <div class="note" id="note" role="status"></div>
</div>
<div class="sync" id="sync" role="status"></div>

<script type="module">
import * as S from './srs.js';
import { openStore, outbox, configured } from './store.js';

const LANGS = { de: 'Deutsch', en: 'English', es: 'Español', fr: 'Français', it: 'Italiano', pt: 'Português', nl: 'Nederlands' };
const SPEECH = { de: 'de-DE', en: 'en-GB', es: 'es-ES', fr: 'fr-FR', it: 'it-IT', pt: 'pt-PT', nl: 'nl-NL' };
const FLAG_LABEL = { normalized: 'Normalized', corrected: 'Corrected', duplicate: 'Already in deck', uncertain: 'Uncertain' };

let store = null, session = null;
let decks = [], cards = [], progress = {};
let sel = lsGet('wz_deck') || 'all';
let view = 'study', current = null, flipped = false, lastKey = null, cram = null;
let loaded = false;
let deckSort = 'n', deckQuery = '', editingId = null;
let drafts = [], draftNotes = [], addInput = '', addDeck = null, generating = false;
let pending = 0;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const note = (t, err) => { const n = $('#note'); n.textContent = t || ''; n.classList.toggle('err', !!err); };
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));

/* ---------- data ---------- */

const activeDecks = () => decks.filter(d => !d.archived);
const deckById = id => decks.find(d => d.id === id);
const deckMap = () => Object.fromEntries(decks.map(d => [d.id, d]));
function scopeCards() {
  if (sel === 'all') { const ok = new Set(activeDecks().map(d => d.id)); return cards.filter(c => ok.has(c.deck_id)); }
  return cards.filter(c => c.deck_id === sel);
}
const scopeBuckets = (t = Date.now()) => S.buckets(scopeCards(), progress, deckMap(), t);
const deckCounts = (deckId, t = Date.now()) => S.counts(S.buckets(cards.filter(c => c.deck_id === deckId), progress, deckMap(), t), t);
const studyDeck = () => (sel === 'all' ? null : deckById(sel));
const langOf = card => (deckById(card.deck_id) || {}).source_lang || 'de';
const targetOf = card => (deckById(card.deck_id) || {}).target_lang || 'en';

function applyData({ decks: d, cards: c, states }) {
  decks = d.sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
  cards = c;
  progress = {};
  for (const r of states) progress[S.keyOf(r.card_id, r.direction)] = S.rowToState(r);
  if (sel !== 'all' && !decks.some(x => x.id === sel && !x.archived)) sel = 'all';
  if (current) {
    const card = cards.find(x => x.id === current.card.id);
    if (!card) { current = null; flipped = false; }
    else { current.card = card; if (progress[current.key]) current.p = progress[current.key]; }
  }
}

function cacheSnapshot() {
  const states = [];
  for (const [k, p] of Object.entries(progress)) { const [id, dir] = k.split('__'); states.push(S.stateToRow(id, dir, p)); }
  lsSet('wz_cache', JSON.stringify({ decks, cards, states }));
}

// Pending answers (offline outbox) win over older server data.
async function overlayOutbox() {
  const items = await outbox.all();
  pending = items.length;
  for (const it of items) {
    const k = S.keyOf(it.cardId, it.direction), cur = progress[k];
    const p = S.rowToState(it.next);
    if (!cur || p.last >= cur.last) progress[k] = p;
  }
  showSync();
}

async function refresh() {
  try {
    await flush();
    const data = await store.loadAll();
    applyData(data);
    await overlayOutbox();
    cacheSnapshot();
    loaded = true;
    if (!flipped) render(); else if (view !== 'study') render();
  } catch (e) {
    if (!loaded) $('#app').innerHTML = `<div class="empty"><h2>Can't reach the deck</h2>${esc(e.message || 'Network error')}. It will load as soon as the connection is back.</div>`;
    else note('Offline: showing the last synced data.');
  }
}

let flushing = false;
async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    for (const it of await outbox.all()) {
      try { await store.recordReview(it); await outbox.remove(it.clientId); }
      catch (e) { note('Answers saved on this device; they will sync when the connection is back.'); break; }
    }
  } finally {
    flushing = false;
    pending = (await outbox.all()).length;
    showSync();
    if (!pending && /sync when/.test($('#note').textContent)) note('');
  }
}
function showSync() {
  const el = $('#sync');
  el.textContent = pending ? `${pending} answer${pending > 1 ? 's' : ''} waiting to sync` : '';
  el.classList.toggle('on', !!pending);
}

/* ---------- speech ---------- */

const canSpeak = 'speechSynthesis' in window;
function speak(text, lang, btn) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPEECH[lang] || lang;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith(u.lang)) ||
            speechSynthesis.getVoices().find(v => v.lang.startsWith(lang));
  if (v) u.voice = v;
  u.rate = 0.95;
  $$('.spk').forEach(b => b.classList.remove('on'));
  if (btn) { btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on'); }
  speechSynthesis.speak(u);
}
if (canSpeak) speechSynthesis.getVoices();
const spkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
const spk = (text, lang) => (canSpeak && text ? `<button class="spk" data-say="${esc(text)}" data-lang="${esc(lang)}" title="Listen" aria-label="Listen">${spkSvg}</button>` : '');
function wireSpeakers() { $$('.spk').forEach(b => b.onclick = e => { e.stopPropagation(); speak(b.dataset.say, b.dataset.lang, b); }); }

/* ---------- render ---------- */

function renderChrome() {
  const signedIn = !!session;
  $('#tabs').hidden = !signedIn || !loaded;
  $('#deckSel').hidden = !signedIn || !loaded || !activeDecks().length;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const d = studyDeck();
  $('#title').innerHTML = `${esc(d ? d.name : activeDecks().length === 1 ? activeDecks()[0].name : 'Alle Decks')} <span>· Wortschatz</span>`;
  document.title = `${d ? d.name : 'Wortschatz'} · Wortschatz`.replace('Wortschatz · Wortschatz', 'Wortschatz');
  if (signedIn && loaded) {
    const t = Date.now();
    const fmt = c => `${c.new} · ${c.learning} · ${c.due}`;
    const all = S.counts(S.buckets(scopeAll(), progress, deckMap(), t), t);
    const opts = [`<option value="all">All decks (${fmt(all)})</option>`]
      .concat(activeDecks().map(x => `<option value="${x.id}">${esc(x.name)} (${fmt(deckCounts(x.id, t))})</option>`));
    const s = $('#deckSel');
    if (document.activeElement !== s) { s.innerHTML = opts.join(''); s.value = sel; }
  }
  document.body.classList.toggle('studying', view === 'study' && !!current);
}
function scopeAll() { const ok = new Set(activeDecks().map(d => d.id)); return cards.filter(c => ok.has(c.deck_id)); }

function render() {
  renderChrome();
  if (!session) return renderLogin();
  if (!loaded) { $('#app').innerHTML = '<div class="empty">Loading deck…</div>'; return; }
  if (view === 'deck') renderDeck();
  else if (view === 'add') renderAdd();
  else if (view === 'decks') renderDecks();
  else if (view === 'settings') renderSettings();
  else renderStudy();
  renderChrome();
}

function details(c) {
  let h = '';
  if (c.forms) h += `<div class="row"><b>Forms</b><div>${esc(c.forms)}</div></div>`;
  if (c.usage) h += `<div class="row"><b>Usage</b><div>${esc(c.usage)}</div></div>`;
  if (c.example) h += `<div class="row"><b>Example</b><div class="ex">${esc(c.example)}${spk(c.example, langOf(c))}${c.example_translation ? `<i>${esc(c.example_translation)}</i>` : ''}</div></div>`;
  return h;
}

function renderStudy() {
  if (!activeDecks().length) return renderFirstRun();
  const b = scopeBuckets();
  if (!scopeCards().length) {
    $('#app').innerHTML = '<div class="empty"><h2>No cards yet</h2>Add words to this deck and they will appear here.<br><button class="btn2" id="goAdd">Add words</button></div>';
    $('#goAdd').onclick = () => go('add');
    return;
  }
  if (cram) {
    if (!current) current = cram.shift() || null;
    if (!current) { cram = null; return renderStudy(); }
  } else if (!current) current = S.pickNext(b, lastKey);

  const c0 = S.counts(b);
  const counts = cram
    ? `<div class="counts"><div><span class="cram">Extra practice · ${cram.length + 1} left</span></div></div>`
    : `<div class="counts"><div class="n">${c0.new}<small>New</small></div><div class="l">${c0.learning}<small>Learning</small></div><div class="d">${c0.due}<small>Due</small></div></div>`;

  if (!current) {
    const future = S.nextDue(b);
    $('#app').innerHTML = counts + `<div class="card"><div class="empty"><h2>Fertig für heute!</h2>
      ${future ? 'Next card due in ' + S.fmtSpan(future - Date.now()) + '.' : 'Nothing due right now.'}<br>
      <button class="btn2" id="cramBtn">Extra practice (doesn't change the schedule)</button></div></div>`;
    $('#cramBtn').onclick = () => { cram = S.shuffle(S.items(scopeCards(), progress)); current = null; flipped = false; render(); };
    return;
  }

  const c = current.card, rev = current.dir === 'r';
  const src = langOf(c), tgt = targetOf(c);
  const ask = src === 'de' ? 'auf Deutsch?' : `${LANGS[src] || src}?`;
  const front = rev
    ? `<div class="word en">${esc(c.meaning)}</div><div class="hint">${esc(c.pos || '')}${c.pos ? ' · ' : ''}${ask}</div>`
    : `<div class="word">${esc(c.term)}${flipped ? spk(c.term, src) : ''}</div>${c.pos ? `<div class="hint">${esc(c.pos)}</div>` : ''}`;
  const back = !flipped ? '' : `<div class="back"><div class="answer">${rev ? esc(c.term) + spk(c.term, src) : esc(c.meaning)}</div>${details(c)}</div>`;
  let actions;
  if (!flipped) actions = `<button class="show" id="showBtn">Show answer</button><div class="kbd">Space to flip</div>`;
  else {
    const lbl = ['Again', 'Hard', 'Good', 'Easy'], t = Date.now();
    actions = `<div class="grades">${[1, 2, 3, 4].map(g => {
      const nx = cram ? '' : S.fmtSpan(S.schedule(current.p, g, t).due - t);
      return `<button class="g${g}" data-g="${g}">${lbl[g - 1]}${nx ? `<small>${nx}</small>` : ''}</button>`;
    }).join('')}</div><div class="kbd">1 Again · 2 Hard · 3 Good · 4 Easy</div>`;
  }
  const stat = current.p.reps ? `✓ ${current.p.correct} · ✗ ${current.p.wrong}` : 'new card';
  const dirLabel = rev ? `${LANGS[tgt] || tgt} → ${LANGS[src] || src}` : `${LANGS[src] || src} → ${LANGS[tgt] || tgt}`;
  const deckTag = sel === 'all' && activeDecks().length > 1 ? ` · ${esc((deckById(c.deck_id) || {}).name || '')}` : '';
  $('#app').innerHTML = counts + `<div class="card${flipped ? '' : ' tap'}" id="theCard">
      <div class="dir"><span>${dirLabel}${deckTag}</span><span>${stat}</span></div>
      <div class="front">${front}</div>${back}</div>
      <div class="actions">${actions}</div>`;
  const sb = $('#showBtn'); if (sb) sb.onclick = flip;
  $$('.grades button').forEach(btn => btn.onclick = () => answer(+btn.dataset.g));
  wireCard($('#theCard'));
  wireSpeakers();
}

// Tap flips; once flipped, swipe left = Again, right = Good.
function wireCard(el) {
  let x0 = null, y0 = null;
  el.onclick = e => { if (!flipped && !e.target.closest('button')) flip(); };
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 == null || !flipped) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 80 && Math.abs(dx) > 2 * Math.abs(dy)) answer(dx < 0 ? 1 : 3);
  });
}

function flip() { if (!current || flipped) return; flipped = true; renderStudy(); renderChrome(); }

async function answer(g) {
  if (!current || !flipped) return;
  const it = current;
  lastKey = it.key; current = null; flipped = false;
  if (cram) { cram = S.cramRequeue(cram, it, g); render(); return; }
  const next = S.schedule(it.p, g);
  progress[it.key] = next;
  render();
  const row = S.stateToRow(it.card.id, it.dir, next);
  const item = { clientId: uuid(), cardId: it.card.id, direction: it.dir, grade: g, stateBefore: it.p.state, next: row };
  await outbox.add(item);
  pending++; showSync();
  cacheSnapshot();
  flush();
}

function renderFirstRun() {

/* ---------- deck table ---------- */

function renderDeck() {
  const t = Date.now(), all = sel === 'all';
  let rows = S.deckRows(scopeCards(), progress, t);
  const total = rows.length, seen = rows.filter(r => r.correct + r.wrong).length, check = rows.filter(r => r.c.needs_review).length;
  rows = rows.filter(r => S.matches(r.c, deckQuery)).sort(S.SORTERS[deckSort] || S.SORTERS.n);
  const sorted = k => (deckSort === k ? ' sorted' : '');
  $('#app').innerHTML = `<div class="deckhead"><span>${total} words · ${seen} studied${check ? ` · <span class="pill warn">${check} to check</span>` : ''}</span>
      <input class="search" id="q" type="search" placeholder="Search" value="${esc(deckQuery)}" aria-label="Search cards"></div>
    ${total ? `<table><thead><tr><th data-s="de" class="${sorted('de')}">Word</th><th>Meaning</th><th data-s="due" class="${sorted('due')}">Status</th><th data-s="wrong" class="num${sorted('wrong')}">✓ / ✗</th></tr></thead><tbody>
    ${rows.map(r => r.c.id === editingId ? editorRow(r.c) : `<tr data-id="${r.c.id}"><td class="de">${esc(r.c.term)}</td><td>${esc(r.c.meaning)}${all ? `<small>${esc((deckById(r.c.deck_id) || {}).name || '')}</small>` : ''}</td><td><span class="pill ${r.status}">${esc(r.label)}</span>${r.c.needs_review ? ' <span class="pill warn">Check</span>' : ''}</td><td class="num">${r.correct} / ${r.wrong}</td></tr>`).join('')}
    </tbody></table>${rows.length ? '' : '<p class="muted">No matches.</p>'}<p class="note">Click a column to sort · click a row to edit</p>` : '<div class="empty">No cards in this deck yet.</div>'}`;
  const q = $('#q');
  q.oninput = () => { deckQuery = q.value; const pos = q.selectionStart; renderDeck(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  $$('th[data-s]').forEach(th => th.onclick = () => { deckSort = deckSort === th.dataset.s ? 'n' : th.dataset.s; renderDeck(); });
  $$('tbody tr[data-id]').forEach(tr => tr.onclick = () => { editingId = tr.dataset.id; renderDeck(); });
  if (editingId) wireEditor();
}

const FIELD_LABELS = { term: 'Word', pos: 'Part of speech', forms: 'Forms', meaning: 'Meaning', usage: 'Usage', example: 'Example', example_translation: 'Translation of the example' };
function fieldsHtml(o, prefix) {
  return `<div class="grid2">${['term', 'pos'].map(f => fieldHtml(o, f, prefix)).join('')}</div>
    ${['meaning', 'forms', 'usage', 'example', 'example_translation'].map(f => fieldHtml(o, f, prefix)).join('')}`;
}
function fieldHtml(o, f, prefix) {
  const long = ['usage', 'example', 'example_translation', 'meaning'].includes(f);
  const v = esc(o[f] || '');
  return `<label class="field">${FIELD_LABELS[f]}${long ? `<textarea data-f="${f}" data-p="${prefix}" rows="2">${v}</textarea>` : `<input data-f="${f}" data-p="${prefix}" value="${v}">`}</label>`;
}
function editorRow(c) {
  const opts = activeDecks().map(d => `<option value="${d.id}"${d.id === c.deck_id ? ' selected' : ''}>${esc(d.name)}</option>`).join('');
  return `<tr class="editing"><td colspan="4"><div class="editor">${fieldsHtml(c, 'e')}
    <div class="bar"><label class="field" style="flex-direction:row;align-items:center;gap:8px">Deck <select id="eDeck">${opts}</select></label>
    <span class="grow"></span><button class="btn2 danger" id="eDel">Delete</button><button class="btn2" id="eCancel">Cancel</button><button class="btn1" id="eSave">Save</button></div></div></td></tr>`;
}
function readFields(prefix) {
  const o = {};
  $$(`[data-p="${prefix}"]`).forEach(el => { o[el.dataset.f] = el.value; });
  return o;
}
function wireEditor() {
  const c = cards.find(x => x.id === editingId);
  if (!c) { editingId = null; return; }
  $('#eCancel').onclick = () => { editingId = null; renderDeck(); };
  $('#eDel').onclick = async () => {
    if (!confirm(`Delete "${c.term}" and its progress? This can't be undone.`)) return;
    try { await store.deleteCard(c.id); cards = cards.filter(x => x.id !== c.id); editingId = null; note('Deleted.'); renderDeck(); cacheSnapshot(); }
    catch (e) { note('Could not delete: ' + e.message, true); }
  };
  $('#eSave').onclick = async () => {
    const f = readFields('e');
    if (!S.draftValid(f)) { note('Word and meaning are required.', true); return; }
    const patch = {};
    for (const k of S.DRAFT_FIELDS) patch[k] = (f[k] || '').trim() || (k === 'term' || k === 'meaning' ? '' : null);
    patch.lemma = S.lemmaOf(patch.term);
    patch.needs_review = false;
    const to = $('#eDeck').value;
    if (to !== c.deck_id) {
      if (cards.some(x => x.deck_id === to && x.lemma === patch.lemma)) { note('That word is already in the other deck.', true); return; }
      patch.deck_id = to;
      patch.position = Math.max(0, ...cards.filter(x => x.deck_id === to).map(x => x.position)) + 1;
    }
    try {
      const saved = await store.updateCard(c.id, patch);
      Object.assign(c, saved || patch);
      editingId = null; note(patch.deck_id ? `Moved to ${(deckById(to) || {}).name}.` : 'Saved.');
      renderDeck(); renderChrome(); cacheSnapshot();
    } catch (e) { note('Could not save: ' + (e.code === '23505' ? 'that word already exists in the deck' : e.message), true); }
  };
}

/* ---------- add words ---------- */

function renderAdd() {
  const ds = activeDecks();
  if (!ds.length) return renderFirstRun();
  if (!addDeck || !ds.some(d => d.id === addDeck)) addDeck = sel !== 'all' ? sel : ds[0].id;
  const opts = ds.map(d => `<option value="${d.id}"${d.id === addDeck ? ' selected' : ''}>${esc(d.name)}</option>`).join('');
  const keep = drafts.filter(d => d.include && S.draftValid(d)).length;
  const local = store.mode === 'local';
  $('#app').innerHTML = `<div class="panel"><h2>Add words</h2>
      <p class="help">Pega palabras sueltas, «palabra: definición», formas flexionadas, frases o listas. Claude las lleva al lema, avisa de duplicados y corrige palabras mal escritas. Nada se guarda hasta que pulses «Save».</p>
      <label class="field">Deck <select id="aDeck">${opts}</select></label>
      <textarea class="big" id="aInput" maxlength="8000" placeholder="Zorns&#10;fordert&#10;verrappeln&#10;Urteil: decisión judicial" style="margin-top:10px">${esc(addInput)}</textarea>
      <div class="bar"><span class="muted" id="aCount" style="font-size:12px">${addInput.length} / 8000</span><span class="grow"></span>
        <button class="btn2" id="aManual">Add a card by hand</button>
        <button class="btn1" id="aGen" ${generating || local ? 'disabled' : ''} title="${local ? 'Needs the server (demo mode)' : ''}">${generating ? 'Generating…' : 'Generate with Claude'}</button></div>
      ${local ? '<p class="help" style="margin:8px 0 0">Demo mode: Claude is available once Supabase is set up (see README).</p>' : ''}
    </div>
    ${draftNotes.length ? `<div class="panel"><h2>Notes from Claude</h2>${draftNotes.map(n => `<p class="help" style="margin:4px 0">${esc(n)}</p>`).join('')}</div>` : ''}
    ${drafts.length ? `<div class="panel"><h2>Preview</h2><p class="help">Edit or untick cards before saving. Duplicates start unticked.</p>
      ${drafts.map((d, i) => draftHtml(d, i)).join('')}
      <div class="bar"><button class="btn2" id="aClear">Discard all</button><span class="grow"></span><button class="btn1" id="aSave" ${keep ? '' : 'disabled'}>Save ${keep} card${keep === 1 ? '' : 's'}</button></div></div>` : ''}`;

  $('#aDeck').onchange = e => { addDeck = e.target.value; recheckDrafts(); renderAdd(); };
  const ta = $('#aInput');
  ta.oninput = () => { addInput = ta.value; $('#aCount').textContent = `${addInput.length} / 8000`; };
  $('#aManual').onclick = () => { syncDrafts(); drafts.push({ term: '', meaning: '', flags: [], include: true, manual: true }); renderAdd(); };
  $('#aGen').onclick = generate;
  const clr = $('#aClear'); if (clr) clr.onclick = () => { drafts = []; draftNotes = []; renderAdd(); };
  const sv = $('#aSave'); if (sv) sv.onclick = saveDrafts;
  $$('[data-inc]').forEach(cb => cb.onchange = () => { syncDrafts(); drafts[+cb.dataset.inc].include = cb.checked; renderAdd(); });
  $$('[data-drop]').forEach(b => b.onclick = () => { syncDrafts(); drafts.splice(+b.dataset.drop, 1); renderAdd(); });
}
function draftHtml(d, i) {
  const flags = (d.flags || []).map(f => `<span class="pill ${f === 'duplicate' ? 'learn' : 'warn'}">${FLAG_LABEL[f] || esc(f)}</span>`).join(' ');
  const from = d.user_input && S.lemmaOf(d.user_input) !== d.lemma ? `<span class="muted" style="font-size:12.5px">from “${esc(d.user_input)}”</span>` : '';
  return `<div class="draft${d.include ? '' : ' off'}">
    <div class="top"><label><input type="checkbox" data-inc="${i}" ${d.include ? 'checked' : ''}> ${esc(d.term || 'New card')}</label>${from} ${flags}<button class="x" data-drop="${i}" title="Discard" aria-label="Discard">×</button></div>
    ${d.flag_note ? `<div class="flagnote">${esc(d.flag_note)}</div>` : ''}
    <div class="editor">${fieldsHtml(d, 'd' + i)}</div></div>`;
}
// Copies what was typed in the preview back into `drafts` before a re-render.
function syncDrafts() {
  drafts.forEach((d, i) => { const f = readFields('d' + i); for (const k of Object.keys(f)) d[k] = f[k]; });
}
function recheckDrafts() {
  const lemmas = cards.filter(c => c.deck_id === addDeck).map(c => c.lemma);
  drafts = S.prepareDrafts(drafts, lemmas).map((d, i) => ({ ...d, include: drafts[i].include && !d.flags.includes('duplicate') }));
}
async function generate() {
  syncDrafts();
  const input = addInput.trim();
  if (!input) { note('Paste some words first.', true); return; }
  generating = true; note('Asking Claude… this takes a few seconds.'); renderAdd();
  try {
    const r = await store.generate(addDeck, input);
    const lemmas = cards.filter(c => c.deck_id === addDeck).map(c => c.lemma);
    drafts = drafts.concat(S.prepareDrafts(r.cards || [], lemmas.concat(drafts.map(d => S.lemmaOf(d.term)))));
    draftNotes = r.notes || [];
    note(`${(r.cards || []).length} cards ready to review.`);
  } catch (e) { note('Generation failed: ' + e.message, true); }
  generating = false; renderAdd();
}
async function saveDrafts() {
  syncDrafts();
  const keep = drafts.filter(d => d.include);
  const bad = keep.filter(d => !S.draftValid(d));
  if (bad.length) { note('Every card needs a word and a meaning.', true); return; }
  let pos = Math.max(0, ...cards.filter(c => c.deck_id === addDeck).map(c => c.position));
  const rows = keep.map(d => S.draftToRow(d, addDeck, ++pos));
  $('#aSave').disabled = true;
  try {
    const r = await store.insertCards(rows);
    cards = cards.concat(r.inserted);
    const saved = new Set(r.inserted.map(c => c.lemma));
    drafts = drafts.filter(d => !(d.include && saved.has(S.lemmaOf(d.term))));
    if (!drafts.length) { addInput = ''; draftNotes = []; }
    note(`Saved ${r.inserted.length} card${r.inserted.length === 1 ? '' : 's'}${r.skipped.length ? ` · skipped (already in the deck): ${r.skipped.join(', ')}` : ''}.`);
    cacheSnapshot(); renderAdd(); renderChrome();
  } catch (e) { note('Could not save: ' + e.message, true); renderAdd(); }
}

function deckSettings(el, d) {
  const n = cards.filter(x => x.deck_id === d.id).length;
  el.innerHTML = `<div style="flex:1"><div class="grid2"><label class="field">Name<input id="sName" value="${esc(d.name)}"></label>

    <button class="btn2" id="sCancel">Cancel</button><button class="btn1" id="sSave">Save</button></div></div>`;
  const upd = async patch => {
    try { Object.assign(d, await store.updateDeck(d.id, patch)); cacheSnapshot(); render(); note('Saved.'); }
    catch (e) { note('Could not save: ' + e.message, true); }

  $('#sArch').onclick = () => upd({ archived: !d.archived });

    const typed = prompt(`Delete "${d.name}" with its ${n} cards and all their progress? This can't be undone.\n\nType the deck name to confirm.`);

    if (typed.trim() !== d.name) { note('Name did not match. Nothing was deleted.', true); return; }
    try {
      await store.deleteDeck(d.id);
      const gone = new Set(cards.filter(c => c.deck_id === d.id).map(c => c.id));
      decks = decks.filter(x => x.id !== d.id); cards = cards.filter(c => !gone.has(c.id));
      if (sel === d.id) sel = 'all';
      if (current && gone.has(current.card.id)) { current = null; flipped = false; }
      note(`Deleted "${d.name}".`); cacheSnapshot(); render();
    } catch (e) { note('Could not delete: ' + e.message, true); }
  };
}

/* ---------- settings ---------- */

function download(name, obj) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportDeck(d) {
  const data = S.buildExport(d, cards.filter(c => c.deck_id === d.id), progress);
  download(`wortschatz-${d.name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-')}-${new Date().toISOString().slice(0, 10)}.json`, data);
}

function renderSettings() {
  const d = studyDeck();
  const into = activeDecks().map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('#app').innerHTML = `${d ? `<div class="panel"><h2>${esc(d.name)}</h2><p class="help">Límite de tarjetas nuevas por día de este mazo. El día empieza a las 04:00.</p>
      <div class="bar" style="margin:0"><label class="field" style="flex-direction:row;align-items:center;gap:8px">New cards per day <input id="stNew" type="number" min="0" max="999" value="${d.new_per_day}" style="width:90px"></label><button class="btn2" id="stNewSave">Save</button></div></div>` : ''}
    <div class="panel"><h2>Export</h2><p class="help">Un JSON por mazo, en el mismo formato que el seed. Se puede volver a importar.</p>
      <div class="bar" style="margin:0">${activeDecks().map(x => `<button class="btn2" data-exp="${x.id}">${esc(x.name)}</button>`).join('') || '<span class="muted">No decks.</span>'}</div></div>
    <div class="panel"><h2>Import</h2><p class="help">Archivo <code>wortschatz-export/v1</code>. Las palabras que ya estén en el mazo se omiten.</p>
      <div class="grid2"><label class="field">File<input type="file" id="impFile" accept="application/json,.json"></label>
      <label class="field">Into<select id="impInto"><option value="">A new deck</option>${into}</select></label></div>
      <div class="bar"><span class="grow"></span><button class="btn1" id="impGo">Import</button></div></div>
    <div class="panel"><h2>Account</h2><p class="help">${store.mode === 'local' ? 'Demo mode: data is stored only in this browser. Fill in config.js to sync across devices.' : `Signed in as ${esc(session.user.email)}. Progress syncs between devices.`}</p>
      <div class="bar" style="margin:0">${store.mode === 'local' ? '' : '<button class="btn2" id="outBtn">Sign out</button>'}<button class="btn2" id="syncBtn">Sync now</button><span class="muted" style="font-size:12.5px">${pending ? `${pending} answers waiting to sync` : 'Everything synced'}</span></div></div>`;
  const ns = $('#stNewSave');
  if (ns) ns.onclick = async () => { try { Object.assign(d, await store.updateDeck(d.id, { new_per_day: Math.max(0, +$('#stNew').value || 0) })); note('Saved.'); cacheSnapshot(); renderChrome(); } catch (e) { note('Could not save: ' + e.message, true); } };
  $$('[data-exp]').forEach(b => b.onclick = () => exportDeck(deckById(b.dataset.exp)));
  $('#impGo').onclick = async () => {
    const f = $('#impFile').files[0];
    if (!f) { note('Choose a file first.', true); return; }
    try {
      const parsed = S.parseExport(await f.text());
      const r = await store.importDeck(parsed, $('#impInto').value || null);
      note(`Imported ${r.inserted} cards${r.skipped.length ? `, skipped ${r.skipped.length} already in the deck` : ''}.`);
      await refresh();
    } catch (e) { note('Import failed: ' + e.message, true); }
  };
  const ob = $('#outBtn');
  if (ob) ob.onclick = async () => {
    if (pending && !confirm(`${pending} answers have not synced yet and would be lost. Sign out anyway?`)) return;
    await store.signOut(); session = null; loaded = false; lsSet('wz_cache', ''); render();
  };
  $('#syncBtn').onclick = async () => { note('Syncing…'); await refresh(); note(pending ? 'Some answers are still waiting for a connection.' : 'Synced.'); };
}

/* ---------- sign in ---------- */

let loginEmail = lsGet('wz_email') || '', codeSent = false;
function renderLogin() {
  $('#app').innerHTML = `<div class="panel login"><h2>Sign in</h2>
    <p class="help">Te mando un enlace mágico y un código de 6 dígitos. En el iPhone, si la app está instalada, usa el código.</p>
    <label class="field">Email<input id="lEmail" type="email" autocomplete="email" value="${esc(loginEmail)}"></label>
    ${codeSent ? `<label class="field" style="margin-top:10px">Code<input id="lCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label>` : ''}
    <div class="bar"><span class="grow"></span>${codeSent ? '<button class="btn2" id="lResend">Send again</button><button class="btn1" id="lVerify">Sign in</button>' : '<button class="btn1" id="lSend">Send link</button>'}</div></div>`;
  const send = async () => {
    loginEmail = $('#lEmail').value.trim(); lsSet('wz_email', loginEmail);
    if (!loginEmail) return note('Enter your email.', true);
    try { await store.sendLink(loginEmail); codeSent = true; note('Check your email.'); renderLogin(); }
    catch (e) { note('Could not send: ' + e.message, true); }
  };
  if ($('#lSend')) $('#lSend').onclick = send;
  if ($('#lResend')) $('#lResend').onclick = send;
  if ($('#lVerify')) $('#lVerify').onclick = async () => {
    try { await store.verifyCode($('#lEmail').value.trim(), $('#lCode').value.trim()); note(''); }
    catch (e) { note('Wrong or expired code.', true); }
  };
}

/* ---------- events ---------- */

function go(v) {
  if (view === 'add') syncDrafts();
  view = v; editingId = null;
  if (v !== 'study') document.body.classList.remove('studying');
  render(); window.scrollTo(0, 0);
}
$$('#tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
$('#deckSel').onchange = e => {
  sel = e.target.value; lsSet('wz_deck', sel);
  current = null; flipped = false; cram = null; lastKey = null;
  render();
};
document.addEventListener('keydown', e => {
  if (view !== 'study' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if ((e.key === ' ' || e.key === 'Enter') && !flipped && current) { e.preventDefault(); flip(); }
  else if (flipped && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); answer(+e.key); }
  else if (flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); answer(3); }
});
setInterval(() => { if (view === 'study' && !current && !cram && loaded) render(); }, 30000);
let lastRefresh = 0;
const maybeRefresh = () => { if (session && document.visibilityState === 'visible' && Date.now() - lastRefresh > 15000) { lastRefresh = Date.now(); refresh(); } };
document.addEventListener('visibilitychange', maybeRefresh);
window.addEventListener('focus', maybeRefresh);
window.addEventListener('online', () => { if (session) refresh(); });
setInterval(() => { if (session && !flipped && document.visibilityState === 'visible') refresh(); }, 120000);

/* ---------- boot ---------- */

(async () => {
  try { store = await openStore(); }
  catch (e) { $('#app').innerHTML = `<div class="empty"><h2>Can't start</h2>${esc(e.message)}</div>`; return; }
  session = await store.session();
  store.onAuth(s => {
    const was = !!session; session = s;
    if (s && !was) { loaded = false; render(); refresh(); }
    if (!s && was) { loaded = false; render(); }
  });
  if (!session) return render();
  // Show cached data at once, then refresh from the server.
  try {
    const c = JSON.parse(lsGet('wz_cache') || 'null');
    if (c && c.decks) { applyData(c); await overlayOutbox(); loaded = true; render(); }
  } catch {}
  lastRefresh = Date.now();
  await refresh();
})();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
