function newCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
function spr(rows, over) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const [c, g] = newCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x];
    const col = over && ch in over ? over[ch] : PAL[ch];
    if (!col) continue;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function flipX(src) {
  const [c, g] = newCanvas(src.width, src.height);
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
function rot90(src, q) {
  q = ((q % 4) + 4) % 4;
  if (q === 0) return src;
  const sw = src.width, sh = src.height;
  const [c, g] = newCanvas(q % 2 ? sh : sw, q % 2 ? sw : sh);
  const sd = src.getContext('2d').getImageData(0, 0, sw, sh);
  const out = g.createImageData(c.width, c.height);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    let nx, ny;
    if (q === 1) { nx = sh - 1 - y; ny = x; }
    else if (q === 2) { nx = sw - 1 - x; ny = sh - 1 - y; }
    else { nx = y; ny = sw - 1 - x; }
    const si = (y * sw + x) * 4, di = (ny * c.width + nx) * 4;
    for (let k = 0; k < 4; k++) out.data[di + k] = sd.data[si + k];
  }
  g.putImageData(out, 0, 0);
  return c;
}
const whiteCache = new Map();
function white(src) {
  let c = whiteCache.get(src);
  if (c) return c;
  let g; [c, g] = newCanvas(src.width, src.height);
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  whiteCache.set(src, c);
  return c;
}

function buildBoss() {

  const rows = [];
  for (let y = 0; y < 32; y++) rows.push('.'.repeat(32).split(''));
  const put = (x, y, ch) => { if (x >= 0 && y >= 0 && x < 32 && y < 32) rows[y][x] = ch; };
  const rect = (x, y, w, h, ch) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(x + i, y + j, ch); };

  for (let y = 14; y < 31; y++) {
    const half = 6 + Math.floor((y - 14) * 0.55);
    for (let x = 16 - half; x < 16 + half; x++) put(x, y, (x === 16 - half || x === 16 + half - 1) ? 'k' : ((x + y) % 7 === 0 ? 'M' : 'm'));
  }

  for (let x = 8; x < 24; x++) put(x, 18, 'y');

  for (let j = 0; j < 3; j++) { rect(11, 20 + j * 2, 4, 1, 'w'); rect(17, 20 + j * 2, 4, 1, 'w'); }
  // arms
  rect(6, 16, 3, 8, 'w'); rect(23, 16, 3, 8, 'w'); rect(6, 24, 3, 2, 'k'); rect(23, 24, 3, 2, 'k');
  rect(5, 16, 1, 8, 'k'); rect(26, 16, 1, 8, 'k');

/* ════════════════════════════════════════════════════════════════════
   RNG, NOISE, PATHFINDING
════════════════════════════════════════════════════════════════════ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) { return vnoise(x, y, s) * 0.6 + vnoise(x * 2, y * 2, s + 7) * 0.3 + vnoise(x * 4, y * 4, s + 13) * 0.1; }

function astar(m, s, goal, cost) {
  const W = m.w, H = m.h, N = W * H;
  const gS = new Float32Array(N).fill(Infinity), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const heap = [];
  const push = (i, f) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => {
    const top = heap[0], last = heap.pop();
    if (heap.length) { heap[0] = last; let k = 0;
      for (;;) { const l = 2 * k + 1, r = l + 1; let j = k;
        if (l < heap.length && heap[l][0] < heap[j][0]) j = l;
        if (r < heap.length && heap[r][0] < heap[j][0]) j = r;
        if (j === k) break; [heap[j], heap[k]] = [heap[k], heap[j]]; k = j; } }
    return top;
  };
  const si = s.r * W + s.c, gi = goal.r * W + goal.c;
  gS[si] = 0; push(si, 0);
  while (heap.length) {
    const i = pop()[1];
    if (closed[i]) continue;
    closed[i] = 1;
    if (i === gi) break;
    const c = i % W, r = (i / W) | 0;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 1 || nr < 1 || nc >= W - 1 || nr >= H - 1) continue;
      const ni = nr * W + nc;
      if (closed[ni]) continue;
      const cs = cost(nc, nr);
      if (cs === Infinity) continue;
      const ng = gS[i] + cs;
      if (ng < gS[ni]) { gS[ni] = ng; came[ni] = i; push(ni, ng + Math.abs(nc - goal.c) + Math.abs(nr - goal.r)); }
    }
  }
  if (came[gi] === -1 && gi !== si) return [];
  const path = [];
  for (let i = gi; i !== -1; i = came[i]) path.push({ c: i % W, r: (i / W) | 0 });
  return path.reverse();
}

════════════════════════════════════════════════════════════════════ */
function makeMap(id, w, h, fill) {
  return { id, w, h, t: new Uint8Array(w * h).fill(fill), block: new Uint8Array(w * h),

}
function getT(m, c, r) {
  if (c < 0 || r < 0 || c >= m.w || r >= m.h) return m.id === 'over' ? T.TREE : T.WALL;
  return m.t[r * m.w + c];
}
function setT(m, c, r, v) { if (c >= 0 && r >= 0 && c < m.w && r < m.h) m.t[r * m.w + c] = v; }
function tileFree(m, c, r, fly) {
  if (c < 0 || r < 0 || c >= m.w || r >= m.h) return false;
  const t = m.t[r * m.w + c];

}
function boxFree(m, x, y, hw, hh, fly) {
  const x0 = Math.floor((x - hw) / TILE), x1 = Math.floor((x + hw - 0.01) / TILE);
  const y0 = Math.floor((y - hh) / TILE), y1 = Math.floor((y + hh - 0.01) / TILE);

  const path = astar(m, from, { c, r }, (nc, nr) => {

    const t = getT(m, nc, nr);
    if (WALK[t]) return 1;
    return t === T.TREE ? 3 : t === T.ROCK ? 4 : t === T.WATER ? 5 : Infinity;
  });
  for (const p of path) {
    if (p.c === c && p.r === r) continue;
    const t = getT(m, p.c, p.r);
    if (t === T.TREE || t === T.ROCK) setT(m, p.c, p.r, T.GRASS);
    else if (t === T.WATER) setT(m, p.c, p.r, T.BRIDGE);

}
function findFree(m, c, r, maxR, ok) {
  for (let rad = 0; rad <= maxR; rad++)
    for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
      if (Math.max(Math.abs(dc), Math.abs(dr)) !== rad) continue;
      const nc = c + dc, nr = r + dr;

      if (ok(getT(m, nc, nr)) && !objAt(m, nc, nr)) return { c: nc, r: nr };

const CAMP = { c: 16, r: 55 };          // spawn tile

function genOverworld() {

  let rx = 44;
  for (let r = 0; r < H; r++) {
    rx += Math.round((rnd() - 0.5) * 2.2);
    rx = Math.max(38, Math.min(52, rx));
    for (let k = 0; k < 3; k++) setT(m, rx + k, r, T.WATER);
  }
  // Forest border
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
    if (c < 2 || r < 2 || c >= W - 2 || r >= H - 2) setT(m, c, r, T.TREE);

  const disk = (cx, cy, rad, t) => {
    for (let r = Math.floor(cy - rad); r <= cy + rad; r++) for (let c = Math.floor(cx - rad); c <= cx + rad; c++)
      if ((c - cx) ** 2 + (r - cy) ** 2 <= rad * rad && c > 1 && r > 1 && c < W - 2 && r < H - 2) setT(m, c, r, t);
  };
  // Camp clearing
  disk(16, 52, 6.5, T.GRASS);
  for (let r = 50; r <= 53; r++) for (let c = 14; c <= 18; c++) setT(m, c, r, T.PLANKS);
  // Dungeon plaza in the mountains
  disk(80, 14, 4.6, T.GRASS);
  for (let r = 4; r <= 20; r++) for (let c = 72; c <= 88; c++) {
    const d = Math.hypot(c - 80, r - 14);
    if (d > 5 && d < 7.5 && r <= 15) setT(m, c, r, T.ROCK);
  }
  for (let r = 5; r <= 10; r++) for (let c = 77; c <= 83; c++) setT(m, c, r, T.ROCK);
  setT(m, DUN_ENTRY.c, DUN_ENTRY.r, T.STAIRS_DOWN);
  // Sand along water, flowers on grass
  for (let r = 1; r < H - 1; r++) for (let c = 1; c < W - 1; c++) {
    if (getT(m, c, r) !== T.GRASS) continue;
    const nearWater = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dc, dr]) => getT(m, c + dc, r + dr) === T.WATER);
    if (nearWater && hash2(c, r, S + 9) < 0.7) setT(m, c, r, T.SAND);
    else if (hash2(c, r, S + 11) < 0.045) setT(m, c, r, T.FLOWERS);
  }
  // Road from camp to the crypt
  const road = astar(m, { c: 16, r: 56 }, { c: DUN_ENTRY.c, r: DUN_ENTRY.r + 1 }, (c, r) => {
    const t = getT(m, c, r);
    if (t === T.ROCK) return 9; if (t === T.TREE) return 5; if (t === T.WATER) return 6;
    if (t === T.STAIRS_DOWN) return Infinity;
    return 1 + hash2(c, r, 77) * 0.6;
  });
  for (const p of road) {
    const t = getT(m, p.c, p.r);
    if (t === T.PLANKS || t === T.STAIRS_DOWN) continue;
    setT(m, p.c, p.r, t === T.WATER ? T.BRIDGE : T.PATH);
  }

  // Camp objects
  addObj(m, { kind: 'campfire', c: 16, r: 51, solid: true });
  addObj(m, { kind: 'anvil', c: 18, r: 50, solid: true });
  addObj(m, { kind: 'chest', id: 'c_camp', c: 14, r: 50, solid: true, opened: false,
              loot: [['bandage', 2], ['wood', 2]] });
  addObj(m, { kind: 'sign', c: 13, r: 55, solid: true,
              text: 'Greenhollow camp. Press E to chop trees, mine rocks and pick herbs, then press C to craft. The anvil forges iron gear. Rest at the fire to heal and save. The Hollow Crypt lies north-east, at the end of the road.' });
  addObj(m, { kind: 'sign', c: 83, r: 13, solid: true,
              text: 'The Hollow Crypt. The Bone King sleeps at the bottom. Bring a weapon and something to heal with.' });

  const groundNear = (c, r, rad) => findFree(m, c, r, rad, isGround);
  const clearAround = p => { for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const t = getT(m, p.c + dc, p.r + dr); if (t === T.TREE || t === T.ROCK) setT(m, p.c + dc, p.r + dr, T.GRASS); } };

  // Weapon chests scattered around the world
  const CHEST_SPOTS = [
    { id: 'c_forest',   at: [10, 16], loot: [['bow', 1], ['arrows', 12]] },
    { id: 'c_lake',     at: [32, 64], loot: [['wood_shield', 1], ['herb', 3]] },
    { id: 'c_mountain', at: [69, 31], loot: [['iron_sword', 1], ['iron', 2]] },
    { id: 'c_east',     at: [86, 58], loot: [['potion', 2], ['gold', 5]] },
    { id: 'c_north',    at: [30, 8],  loot: [['pickaxe', 1], ['coal', 2], ['torch', 1]] },
  ];
  for (const s of CHEST_SPOTS) {
    const p = groundNear(s.at[0], s.at[1], 8) || { c: s.at[0], r: s.at[1] };
    clearAround(p); setT(m, p.c, p.r, T.GRASS);
    addObj(m, { kind: 'chest', id: s.id, c: p.c, r: p.r, solid: true, opened: false, loot: s.loot.map(l => l.slice()) });
  }

  // Resource nodes
  const addNode = (res, c, r) => {
    const max = res === 'herb' ? 2 : 3;
    addObj(m, { kind: 'node', res, c, r, solid: res !== 'herb', left: max, max, respawn: 0 });
  };
  const near = [[3, 3], [-4, 2], [5, -3], [-3, -4], [6, 4], [-6, -1]];
  near.forEach(([dc, dr], i) => {
    const p = groundNear(16 + dc * 1.5 | 0, 52 + dr * 1.5 | 0, 4);
    if (p && Math.hypot(p.c - 16, p.r - 52) > 3.5) addNode(i % 2 ? 'herb' : 'stone', p.c, p.r);
  });
  const scatter = (res, n, inRegion) => {
    let placed = 0;
    for (let tries = 0; tries < 3000 && placed < n; tries++) {
      const c = 3 + Math.floor(rnd() * (W - 6)), r = 3 + Math.floor(rnd() * (H - 6));
      if (!inRegion(c, r) || !isGround(getT(m, c, r)) || objAt(m, c, r)) continue;
      if (Math.hypot(c - 16, r - 52) < 6 || Math.hypot(c - 80, r - 14) < 5) continue;
      if (getT(m, c, r) === T.PATH) continue;
      addNode(res, c, r); placed++;
    }
  };
  scatter('stone', 16, () => true);
  scatter('herb', 20, () => true);
  scatter('iron', 7, (c, r) => c > 56 && r < 40);
  scatter('coal', 7, (c, r) => c > 56 && r < 40);
  // A few trees around camp so wood is easy to find
  for (const [c, r] of [[10, 48], [22, 47], [9, 56], [23, 57], [11, 60], [21, 61]])
    if (isGround(getT(m, c, r)) && !objAt(m, c, r)) setT(m, c, r, T.TREE);

  // Make sure every chest and every ore rock can be reached
  for (const o of m.objects) if (o.kind === 'chest' || (o.kind === 'node' && (o.res === 'iron' || o.res === 'coal'))) ensureReach(m, CAMP, o.c, o.r);
  ensureReach(m, CAMP, DUN_ENTRY.c, DUN_ENTRY.r + 1);
  m.reach = reachMask(m, CAMP.c, CAMP.r);
  return m;
}

/* ── Dungeon: Hollow Crypt ── */
const ROOMS = {
  entry: { x: 28, y: 40, w: 8,  h: 5  },
  hall:  { x: 25, y: 28, w: 14, h: 8  },
  west:  { x: 6,  y: 26, w: 13, h: 11 },
  east:  { x: 45, y: 26, w: 13, h: 11 },
  gate:  { x: 23, y: 14, w: 18, h: 9  },
  boss:  { x: 20, y: 1,  w: 24, h: 10 },
};
function genDungeon() {
  const m = makeMap('dungeon', 64, 48, T.WALL);
  m.name = 'The Hollow Crypt'; m.dark = true;
  const carve = (x, y, w, h) => { for (let r = y; r < y + h; r++) for (let c = x; c < x + w; c++) setT(m, c, r, T.FLOOR); };
  for (const k in ROOMS) { const R = ROOMS[k]; carve(R.x, R.y, R.w, R.h); }
  carve(31, 36, 3, 4);   // entry ↔ hall
  carve(19, 31, 6, 3);   // hall ↔ west
  carve(39, 31, 6, 3);   // hall ↔ east
  carve(31, 23, 3, 5);   // hall ↔ gate
  carve(31, 11, 3, 3);   // gate ↔ boss
  for (let c = 31; c <= 33; c++) setT(m, c, 11, T.DOOR);
  setT(m, 32, 44, T.STAIRS_UP);
  for (const [c, r] of [[25, 4], [38, 4], [25, 8], [38, 8], [27, 17], [36, 17], [27, 20], [36, 20], [10, 30], [14, 30], [50, 30], [53, 33]]) setT(m, c, r, T.WALL);

  // Wall torches along the top wall of each room
  for (const k in ROOMS) {
    const R = ROOMS[k];
    const xs = R.w > 12 ? [R.x + 2, R.x + (R.w >> 1), R.x + R.w - 3] : [R.x + 1, R.x + R.w - 2];
    for (const c of xs) if (getT(m, c, R.y - 1) === T.WALL && c !== 32) m.objects.push({ kind: 'walltorch', c, r: R.y - 1 });
  }
  addObj(m, { kind: 'chest', id: 'd_west', c: 7,  r: 27, solid: true, opened: false, loot: [['knight_blade', 1], ['potion', 1]] });
  addObj(m, { kind: 'chest', id: 'd_east', c: 56, r: 27, solid: true, opened: false, loot: [['key', 1], ['potion', 1], ['arrows', 10]] });
  addObj(m, { kind: 'chest', id: 'd_gate', c: 24, r: 15, solid: true, opened: false, loot: [['bandage', 3], ['torch', 1]] });
  addObj(m, { kind: 'sign', c: 35, r: 14, solid: true, text: "The King's door is sealed. Whoever buried him hid the key in the east wing." });
  m.explored = new Uint8Array(m.w * m.h);
  return m;
}

function spawnOverEnemies(m) {
  m.enemies = [];
  const pick = (pred) => {
    for (let i = 0; i < 400; i++) {
      const c = 3 + Math.floor(Math.random() * (m.w - 6)), r = 3 + Math.floor(Math.random() * (m.h - 6));
      if (!m.reach[r * m.w + c] || !pred(c, r)) continue;
      if (Math.hypot(c - CAMP.c, r - CAMP.r) < 14) continue;
      return { c, r };
    }
    return null;
  };
  for (let i = 0; i < 14; i++) { const p = pick(() => true); if (p) m.enemies.push(mkEnemy('slime', p.c * TILE + 8, p.r * TILE + 12)); }
  for (let i = 0; i < 4; i++)  { const p = pick((c, r) => c > 56 && r < 40); if (p) m.enemies.push(mkEnemy('bat', p.c * TILE + 8, p.r * TILE + 12)); }
}
function spawnDungeonEnemies(m) {
  m.enemies = [];
  const at = (type, c, r) => m.enemies.push(mkEnemy(type, c * TILE + 8, r * TILE + 12));
  [[28, 30], [36, 30], [32, 33]].forEach(p => at('slime', ...p));
  [[9, 28], [15, 34], [8, 34]].forEach(p => at('skeleton', ...p)); at('slime', 15, 28);
  [[48, 29], [55, 30], [49, 35], [55, 35]].forEach(p => at('bat', ...p)); at('skeleton', 51, 31);
  [[26, 18], [38, 19]].forEach(p => at('skeleton', ...p));
  [[30, 21], [35, 16]].forEach(p => at('slime', ...p));
  [[25, 21], [39, 15]].forEach(p => at('bat', ...p));
  if (!G.bossDefeated) { const b = mkEnemy('boss', 32 * TILE + 8, 5 * TILE + 8); m.enemies.push(b); }
}
function mkEnemy(type, x, y) {
  const d = ENEMY[type];
  return { type, x, y, hp: d.hp, maxHp: d.hp, dmg: d.dmg, r: d.r, cy: d.cy, hw: d.hw, hh: d.hh, fly: d.fly,
           vx: 0, vy: 0, kbx: 0, kby: 0, flash: 0, t: Math.floor(Math.random() * 60), hop: 0,
           alive: true, moving: false, face: 1, state: 'idle', st: 0, active: false, summons: 0, wave: 0 };
}

/* ── Map rendering (baked once, re-baked when tiles change) ── */
function bakeMap(m) {
  const [c, g] = newCanvas(m.w * TILE, m.h * TILE);
  m.canvas = c; m.ctx = g;
  for (let r = 0; r < m.h; r++) for (let col = 0; col < m.w; col++) drawTileTo(m, g, col, r);
  const [mc, mg] = newCanvas(m.w, m.h);
  m.mini = mc; m.miniCtx = mg;
  if (!m.dark) for (let r = 0; r < m.h; r++) for (let col = 0; col < m.w; col++) { mg.fillStyle = MINI_COL[getT(m, col, r)]; mg.fillRect(col, r, 1, 1); }
}
function rebakeTiles(m, cells) {
  for (const [c, r] of cells) for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const nc = c + dc, nr = r + dr;
    if (nc < 0 || nr < 0 || nc >= m.w || nr >= m.h) continue;
    m.ctx.clearRect(nc * TILE, nr * TILE, TILE, TILE);
    drawTileTo(m, m.ctx, nc, nr);
    if (!m.dark || m.explored[nr * m.w + nc]) { m.miniCtx.fillStyle = MINI_COL[getT(m, nc, nr)]; m.miniCtx.fillRect(nc, nr, 1, 1); }
  }
}
function drawTileTo(m, g, c, r) {
  const t = getT(m, c, r), x = c * TILE, y = r * TILE, hv = hash2(c, r, 5);
  const below = getT(m, c, r + 1);
  switch (t) {
    case T.GRASS:   g.drawImage(TL.grass[(hv * 3) | 0], x, y); break;
    case T.FLOWERS: g.drawImage(TL.flowers[(hv * 2) | 0], x, y); break;
    case T.PATH:    g.drawImage(TL.path[(hv * 3) | 0], x, y); break;
    case T.SAND:    g.drawImage(TL.sand[(hv * 2) | 0], x, y); break;
    case T.PLANKS:  g.drawImage(TL.planks, x, y); break;
    case T.TREE:    g.drawImage(TL.grass[(hv * 3) | 0], x, y); g.drawImage(hv > 0.5 ? SPR.tree : SPR.treeF, x, y); break;
    case T.ROCK:    g.drawImage(below === T.ROCK || below === T.STAIRS_DOWN ? TL.rockTop : TL.rockFront, x, y); break;
    case T.FLOOR:   g.drawImage(TL.floor[hv < 0.55 ? 0 : hv < 0.75 ? 1 : hv < 0.88 ? 2 : 3], x, y); break;
    case T.WALL:    g.drawImage(below === T.WALL || below === T.DOOR || r + 1 >= m.h ? TL.wallTop : TL.wallFront[hv > 0.8 ? 1 : 0], x, y); break;
    case T.DOOR:    g.drawImage(TL.door, x, y); break;
    case T.STAIRS_DOWN: g.drawImage(TL.stairsDown, x, y); break;
    case T.STAIRS_UP:   g.drawImage(TL.stairsUp, x, y); break;
    case T.WATER:
    case T.BRIDGE: {
      g.drawImage(TL.water, x, y);
      g.fillStyle = '#9fc8ea';
      const land = (dc, dr) => { const n = getT(m, c + dc, r + dr); return n !== T.WATER && n !== T.BRIDGE; };
      for (let i = 0; i < 16; i++) {
        if (hash2(c * 16 + i, r, 3) < 0.25) continue;
        if (land(0, -1)) g.fillRect(x + i, y, 1, 1);
        if (land(0, 1))  g.fillRect(x + i, y + 15, 1, 1);
        if (land(-1, 0)) g.fillRect(x, y + i, 1, 1);
        if (land(1, 0))  g.fillRect(x + 15, y + i, 1, 1);
      }
      if (t === T.BRIDGE) {
        const vertical = getT(m, c - 1, r) === T.WATER && getT(m, c + 1, r) === T.WATER;
        g.fillStyle = '#8a5a32';
        if (vertical) {
          g.fillRect(x + 2, y, 12, 16);
          g.fillStyle = '#6a4224'; for (let j = 0; j < 16; j += 4) g.fillRect(x + 2, y + j + 3, 12, 1);
          g.fillStyle = '#4a2e18'; g.fillRect(x + 1, y, 1, 16); g.fillRect(x + 14, y, 1, 16);
        } else {
          g.fillRect(x, y + 2, 16, 12);
          g.fillStyle = '#6a4224'; for (let j = 0; j < 16; j += 4) g.fillRect(x + j + 3, y + 2, 1, 12);
          g.fillStyle = '#4a2e18'; g.fillRect(x, y + 1, 16, 1); g.fillRect(x, y + 14, 16, 1);
        }
      }
      break;
    }
  }
}

/* ════════════════════════════════════════════════════════════════════
   INVENTORY HELPERS
════════════════════════════════════════════════════════════════════ */
function countItem(id) { const s = P.inv.find(s => s.id === id); return s ? s.qty : 0; }
function hasItem(id) { return countItem(id) > 0; }
function addItem(id, qty) {
  if (id === 'heart') { P.maxHp += 2; P.hp = P.maxHp; G.heartTaken = true; showBanner('heart', 'Heart Crystal', 'Maximum health +1 heart'); sfx('heal'); return true; }
  const s = P.inv.find(s => s.id === id);
  if (s) s.qty += qty;
  else { if (P.inv.length >= INV_SLOTS) { toast('Your bag is full.'); return false; } P.inv.push({ id, qty }); }
  autoEquip(id);
  return true;
}
function removeItem(id, qty) {
  const s = P.inv.find(s => s.id === id);
  if (!s || s.qty < qty) return false;
  s.qty -= qty;
  if (s.qty <= 0) {
    P.inv = P.inv.filter(x => x !== s);
    if (P.equip.weapon === id) P.equip.weapon = null;
    if (P.equip.shield === id) P.equip.shield = null;
  }
  return true;
}
function autoEquip(id) {
  const it = ITEMS[id];
  if (it.type === 'weapon' && (!P.equip.weapon || ITEMS[P.equip.weapon].tier < it.tier)) {
    P.equip.weapon = id; showBanner(id, it.name, `Equipped · damage ${it.dmg}`);
  } else if (it.type === 'shield' && (!P.equip.shield || ITEMS[P.equip.shield].tier < it.tier)) {
    P.equip.shield = id; showBanner(id, it.name, `Equipped · blocks ${it.def} per strong hit`);
  } else if ((it.type === 'bow' || it.type === 'tool' || it.type === 'light' || it.type === 'key') && countItem(id) === 1) {
    const sub = { bow: 'Press K to fire arrows', tool: 'You can now mine iron and coal', light: 'You see further in the dark', key: 'Opens the sealed door' }[it.type];
    showBanner(id, it.name, sub);
  }
}
function weapon() { return P.equip.weapon ? ITEMS[P.equip.weapon] : FIST; }
function canCraft(r) { return r.in.every(([id, q]) => countItem(id) >= q); }
function recipeBlocked(r) {
  const it = ITEMS[r.out[0]];
  if (it.unique && hasItem(r.out[0])) return 'You already have one.';
  if (r.station === 'anvil' && !nearAnvil()) return 'Needs the anvil at camp.';
  return '';
}
function doCraft(r) {
  if (!canCraft(r) || recipeBlocked(r)) return false;
  r.in.forEach(([id, q]) => removeItem(id, q));
  addItem(r.out[0], r.out[1]);
  return true;
}
function filteredRecipes() { return ui.craftCat === 'all' ? RECIPES : RECIPES.filter(r => r.cat === ui.craftCat); }
function nearAnvil() {
  const m = curMap();
  return m.objects.some(o => o.kind === 'anvil' && Math.hypot(o.c * TILE + 8 - P.x, o.r * TILE + 8 - P.y) < 44);
}

/* ════════════════════════════════════════════════════════════════════
   FEEDBACK: toasts, banners, particles, sound
════════════════════════════════════════════════════════════════════ */
function toast(text, col) { G.toasts.push({ text, col: col || '#ece6d8', t: 200 }); if (G.toasts.length > 4) G.toasts.shift(); }
function showBanner(id, title, sub) { G.banner = { id, title, sub, t: 170 }; }
function floater(x, y, text, col) { G.floaters.push({ x, y, text, col, t: 50 }); }
function burst(x, y, col, n, speed, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * (speed || 1.2);
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.4, g: grav ?? 0.06, t: 20 + Math.random() * 20 | 0, col, s: Math.random() < 0.3 ? 2 : 1 });
  }
}
let AC = null;
function sfx(type) {
  if (!G.sound) return;
  const S = {
    swing:[460,180,0.08,'triangle',0.05], hit:[240,90,0.1,'square',0.06], hurt:[170,60,0.25,'sawtooth',0.07],
    pick:[660,990,0.08,'sine',0.06], chop:[190,120,0.07,'square',0.05], open:[330,660,0.18,'triangle',0.06],
    craft:[520,880,0.15,'triangle',0.06], boom:[90,30,0.5,'sawtooth',0.1], shoot:[720,300,0.09,'triangle',0.05],
    die:[300,40,0.5,'square',0.07], roar:[120,45,0.8,'sawtooth',0.1], heal:[440,880,0.25,'sine',0.06],
    deny:[200,150,0.12,'square',0.04], door:[110,70,0.4,'square',0.07],
  }[type];
  if (!S) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = S[3]; o.frequency.setValueAtTime(S[0], t); o.frequency.exponentialRampToValueAtTime(S[1], t + S[2]);
    g.gain.setValueAtTime(S[4], t); g.gain.exponentialRampToValueAtTime(0.0001, t + S[2]);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + S[2] + 0.02);
  } catch (e) { /* audio unavailable */ }
}

/* ════════════════════════════════════════════════════════════════════
   SAVE / LOAD
════════════════════════════════════════════════════════════════════ */
function save() {
  try {
    const chests = {};
    for (const id in G.maps) for (const o of G.maps[id].objects) if (o.kind === 'chest') chests[o.id] = { opened: o.opened, loot: o.loot };
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, map: G.map, x: P.x, y: P.y, hp: P.hp, maxHp: P.maxHp, inv: P.inv, equip: P.equip, chests,
      door: G.doorOpen, boss: G.bossDefeated, heart: G.heartTaken, deaths: G.deaths, time: G.time,
    }));
    G.saveExists = true;
  } catch (e) { /* storage unavailable */ }
}
function readSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && s.v === 1 ? s : null; } catch (e) { return null; } }

function buildWorld() {
  G.maps = { over: genOverworld(), dungeon: genDungeon() };
  bakeMap(G.maps.over); bakeMap(G.maps.dungeon);
}
function startGame(continueSave) {
  const s = continueSave ? readSave() : null;
  G.bossDefeated = !!(s && s.boss); G.doorOpen = !!(s && s.door); G.heartTaken = !!(s && s.heart);
  G.deaths = s ? s.deaths || 0 : 0; G.time = s ? s.time || 0 : 0;
  buildWorld();
  if (G.doorOpen) openDoor(G.maps.dungeon, true);
  Object.assign(P, { dir: 'down', hp: 10, maxHp: 10, inv: [], equip: { weapon: null, shield: null }, atkT: 0, atkCd: 0, bowCd: 0, iframes: 0, kbx: 0, kby: 0 });
  if (s) {
    for (const id in G.maps) for (const o of G.maps[id].objects) if (o.kind === 'chest' && s.chests[o.id]) { o.opened = s.chests[o.id].opened; o.loot = s.chests[o.id].loot; }
    P.inv = s.inv; P.equip = s.equip; P.maxHp = s.maxHp; P.hp = Math.max(2, s.hp);
    enterMap(s.map, s.x, s.y, true);
  } else {
    enterMap('over', CAMP.c * TILE + 8, CAMP.r * TILE + 10, true);
    toast('Find a weapon in a chest, or press C and craft one.', '#f2d27a');
    save();
  }
  G.mode = 'play';
  document.getElementById('backLink').hidden = true;
}
function enterMap(id, x, y, snap) {
  G.map = id; const m = curMap();
  P.x = x; P.y = y; m.proj = []; m.drops = [];
  if (id === 'over') spawnOverEnemies(m); else spawnDungeonEnemies(m);
  G.area = { text: m.name, t: 200 };
  updateCamera(true);
}
function transition(fn) { if (!G.fade) G.fade = { t: 0, dur: 22, mid: fn }; }

/* ════════════════════════════════════════════════════════════════════
   INPUT
════════════════════════════════════════════════════════════════════ */
const MOVE_KEYS = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('keydown', e => {
  const code = e.code, enter = code === 'Enter' || code === 'NumpadEnter';
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(code)) e.preventDefault();
  if (e.repeat && !MOVE_KEYS[code]) return;
  keys[code] = true;
  if (G.fade) return;
  const dirKey = MOVE_KEYS[code];

  switch (G.mode) {
    case 'title': {
      const n = G.saveExists ? 2 : 1;
      if (dirKey === 'up' || dirKey === 'down') G.titleSel = (G.titleSel + 1) % n;
      if (enter || code === 'Space') { sfx('open'); const cont = G.saveExists && G.titleSel === 0; transition(() => startGame(cont)); }
      break;
    }
    case 'play':
      if (code === 'Space' || code === 'KeyJ') input.attack = true;
      else if (code === 'KeyK') input.shoot = true;
      else if (code === 'KeyE') input.interact = true;
      else if (code === 'KeyQ') input.heal = true;
      else if (code === 'KeyI' || code === 'Tab') { G.mode = 'inv'; ui.invSel = Math.min(ui.invSel, Math.max(0, P.inv.length - 1)); }
      else if (code === 'KeyC') { G.mode = 'craft'; }
      else if (code === 'KeyM') G.showMap = !G.showMap;
      else if (code === 'Escape' || code === 'KeyP') { G.mode = 'pause'; document.getElementById('backLink').hidden = false; }
      break;
    case 'pause':
      if (code === 'Escape' || code === 'KeyP' || enter) { G.mode = 'play'; document.getElementById('backLink').hidden = true; }
      else if (code === 'KeyX') G.sound = !G.sound;
      else if (code === 'Backspace') { save(); G.mode = 'title'; G.saveExists = !!readSave(); G.titleSel = 0; }
      break;
    case 'inv': {
      const cols = 6;
      if (dirKey === 'right') ui.invSel = Math.min(INV_SLOTS - 1, ui.invSel + 1);
      if (dirKey === 'left')  ui.invSel = Math.max(0, ui.invSel - 1);
      if (dirKey === 'down')  ui.invSel = Math.min(INV_SLOTS - 1, ui.invSel + cols);
      if (dirKey === 'up')    ui.invSel = Math.max(0, ui.invSel - cols);
      if (enter || code === 'Space' || code === 'KeyE') useOrEquip(P.inv[ui.invSel]);
      if (code === 'KeyI' || code === 'Tab' || code === 'Escape') G.mode = 'play';
      if (code === 'KeyC') G.mode = 'craft';
      break;
    }
    case 'craft': {
      const list = filteredRecipes();
      if (dirKey === 'down') ui.craftSel = Math.min(list.length - 1, ui.craftSel + 1);
      if (dirKey === 'up')   ui.craftSel = Math.max(0, ui.craftSel - 1);
      if (code === 'Tab' || dirKey === 'right' || dirKey === 'left') {
        const i = CATS.findIndex(c => c.id === ui.craftCat), step = dirKey === 'left' ? -1 : 1;
        ui.craftCat = CATS[(i + step + CATS.length) % CATS.length].id; ui.craftSel = 0; ui.craftScroll = 0;
      }
      if (enter) craftSelected(e.shiftKey ? 5 : 1);
      if (code === 'KeyC' || code === 'Escape') G.mode = 'play';
      if (code === 'KeyI') G.mode = 'inv';
      break;
    }
    case 'sign':
      if (enter || code === 'KeyE' || code === 'Escape' || code === 'Space') G.mode = 'play';
      break;
    case 'dead':
      if (enter || code === 'Space') transition(respawn);
      break;
    case 'victory':
      if (enter || code === 'Space') G.mode = 'play';
      break;
  }
});

function useOrEquip(slot) {
  if (!slot) return;
  const it = ITEMS[slot.id];
  if (it.type === 'weapon') { P.equip.weapon = P.equip.weapon === slot.id ? null : slot.id; sfx('pick'); toast(P.equip.weapon ? `Equipped ${it.name}.` : `Unequipped ${it.name}.`); }
  else if (it.type === 'shield') { P.equip.shield = P.equip.shield === slot.id ? null : slot.id; sfx('pick'); toast(P.equip.shield ? `Equipped ${it.name}.` : `Unequipped ${it.name}.`); }
  else if (it.type === 'heal') useHeal(slot.id);
  else { sfx('deny'); toast(it.type === 'mat' ? 'Used for crafting. Press C.' : it.desc); }
}
function useHeal(id) {
  if (P.hp >= P.maxHp) { sfx('deny'); toast('Your health is already full.'); return false; }
  const h = Math.min(ITEMS[id].heal, P.maxHp - P.hp);
  removeItem(id, 1); P.hp += h; sfx('heal');
  floater(P.x, P.y - 20, `+${h / 2} ♥`, '#7be08a'); burst(P.x, P.y - 8, '#7be08a', 10, 0.8, -0.02);
  ui.invSel = Math.min(ui.invSel, Math.max(0, P.inv.length - 1));
  return true;
}
function quickHeal() {
  const missing = P.maxHp - P.hp;
  if (missing <= 0) { toast('Your health is already full.'); sfx('deny'); return; }
  const order = missing >= 5 ? ['potion', 'bandage'] : ['bandage', 'potion'];
  const id = order.find(hasItem);
  if (!id) { toast('No bandages or potions. Craft them from herbs.'); sfx('deny'); return; }
  useHeal(id);
}
function craftSelected(times) {
  const r = filteredRecipes()[ui.craftSel];
  if (!r) return;
  const blocked = recipeBlocked(r);
  if (blocked) { toast(blocked); sfx('deny'); return; }
  let n = 0;
  for (let i = 0; i < times; i++) { if (doCraft(r)) n++; else break; if (ITEMS[r.out[0]].unique) break; }
  if (n) { sfx('craft'); toast(`Crafted ${n > 1 ? n + '× ' : ''}${recipeName(r)}.`, '#7be08a'); ui.craftFlash = 20; }
  else { sfx('deny'); toast('Not enough materials.'); }
}

/* ════════════════════════════════════════════════════════════════════
   UPDATE
════════════════════════════════════════════════════════════════════ */
function tick() {
  G.tick++;
  if (G.fade) {
    G.fade.t++;
    if (G.fade.t === G.fade.dur) G.fade.mid();
    if (G.fade.t >= G.fade.dur * 2) G.fade = null;
  }
  for (const t of G.toasts) t.t--;
  G.toasts = G.toasts.filter(t => t.t > 0);
  if (G.banner && --G.banner.t <= 0) G.banner = null;
  if (G.area && --G.area.t <= 0) G.area = null;
  if (ui.craftFlash) ui.craftFlash--;

  if (G.mode === 'title') { G.cam.x = 260 + Math.sin(G.tick / 900) * 200; G.cam.y = 600 + Math.cos(G.tick / 1100) * 140; return; }
  if (G.mode !== 'play') { updateFx(); return; }
  G.time++;
  updatePlayer();
  const m = curMap();
  updateEnemies(m);
  updateProjectiles(m);
  updateDrops(m);
  updateNodes(m);
  updateFx();
  updateFocus(m);
  updateCamera(false);
  if (m.dark) exploreAround(m);
  if (G.victoryAt && G.tick >= G.victoryAt) { G.victoryAt = 0; G.mode = 'victory'; save(); }
  if (G.time % 1800 === 0) save();
}

function updatePlayer() {
  const m = curMap();
  let dx = 0, dy = 0;
  for (const code in MOVE_KEYS) if (keys[code]) { const d = MOVE_KEYS[code]; dx += DIRV[d][0]; dy += DIRV[d][1]; }
  dx = Math.sign(dx); dy = Math.sign(dy);
  P.moving = !!(dx || dy);
  if (P.moving && P.atkT <= 0) {
    if (dx && dy) { if (!((P.dir === 'left' && dx < 0) || (P.dir === 'right' && dx > 0) || (P.dir === 'up' && dy < 0) || (P.dir === 'down' && dy > 0))) P.dir = dx > 0 ? 'right' : 'left'; }
    else P.dir = dx ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
  let sp = 1.3 * (dx && dy ? 0.7071 : 1) * (P.atkT > 0 ? 0.45 : 1);
  if (P.moving) { moveBox(m, P, dx * sp, dy * sp, 4, 3, false); P.animT++; } else P.animT = 0;
  if (P.kbx || P.kby) {
    moveBox(m, P, P.kbx, P.kby, 4, 3, false);
    P.kbx *= 0.78; P.kby *= 0.78;
    if (Math.abs(P.kbx) < 0.05) P.kbx = 0; if (Math.abs(P.kby) < 0.05) P.kby = 0;
  }
  if (P.iframes > 0) P.iframes--;
  if (P.atkCd > 0) P.atkCd--;
  if (P.bowCd > 0) P.bowCd--;
  if (P.bowT > 0) P.bowT--;
  if (P.actCd > 0) P.actCd--;

  // Melee
  if (input.attack) {
    input.attack = false;
    if (P.atkCd <= 0) { P.atkT = ATK_T; P.atkCd = weapon().cd; P.hitSet = new Set(); sfx('swing'); }
  }
  if (P.atkT > 0) {
    const f = ATK_T - P.atkT;
    if (f >= 2 && f <= 8) {
      const [bx, by, bw, bh] = attackBox();
      for (const e of m.enemies) {
        if (!e.alive || P.hitSet.has(e)) continue;
        if (rectCircle(bx, by, bw, bh, e.x, e.y - e.cy, e.r)) {
          P.hitSet.add(e);
          const [vx, vy] = DIRV[P.dir];
          damageEnemy(e, weapon().dmg, vx * 2.6, vy * 2.6);
        }
      }
      for (const p of m.proj) if (p.from === 'enemy' && rectCircle(bx, by, bw, bh, p.x, p.y, 3)) { p.life = 0; burst(p.x, p.y, '#ece6d8', 5, 1); sfx('hit'); }
    }
    P.atkT--;
  }
  // Bow
  if (input.shoot) {
    input.shoot = false;
    if (!hasItem('bow')) { toast('You need a bow. Craft one or find it in a chest.'); sfx('deny'); }
    else if (!hasItem('arrows')) { toast('Out of arrows. Craft more from wood and stone.'); sfx('deny'); }
    else if (P.bowCd <= 0) {
      const [vx, vy] = DIRV[P.dir];
      m.proj.push({ x: P.x + vx * 6, y: P.y - 6 + vy * 4, vx: vx * 3.2, vy: vy * 3.2, from: 'player', dmg: 3, life: 75, kind: 'arrow' });
      removeItem('arrows', 1); P.bowCd = 26; P.bowT = 10; sfx('shoot');
    }
  }
  if (input.heal) { input.heal = false; quickHeal(); }
  if (input.interact) { input.interact = false; interact(m); }

  // Stairs
  const tc = Math.floor(P.x / TILE), tr = Math.floor(P.y / TILE), under = getT(m, tc, tr);
  if (under === T.STAIRS_DOWN && !G.fade) transition(() => { enterMap('dungeon', 32 * TILE + 8, 42 * TILE + 10, true); P.dir = 'up'; save(); });
  if (under === T.STAIRS_UP && !G.fade) transition(() => { enterMap('over', DUN_ENTRY.c * TILE + 8, (DUN_ENTRY.r + 2) * TILE + 6, true); P.dir = 'down'; save(); });
}
function attackBox() {
  const R = weapon().reach, cx = P.x, cy = P.y - 6;
  switch (P.dir) {
    case 'right': return [cx + 2, cy - 9, R, 18];
    case 'left':  return [cx - 2 - R, cy - 9, R, 18];
    case 'down':  return [cx - 9, cy + 1, 18, R];
    default:      return [cx - 9, cy - 1 - R, 18, R];
  }
}
function rectCircle(rx, ry, rw, rh, cx, cy, cr) {
  const nx = Math.max(rx, Math.min(cx, rx + rw)), ny = Math.max(ry, Math.min(cy, ry + rh));
  return (nx - cx) ** 2 + (ny - cy) ** 2 <= cr * cr;
}
function shieldReduce(dmg, def) { return dmg > 1 ? Math.max(1, dmg - def) : dmg; }

function hurtPlayer(dmg, fx, fy) {
  if (P.iframes > 0 || G.mode !== 'play') return;
  const def = P.equip.shield ? ITEMS[P.equip.shield].def : 0;
  const d = shieldReduce(dmg, def);
  P.hp = Math.max(0, P.hp - d);
  P.iframes = 60;
  const a = Math.atan2(P.y - fy, P.x - fx);
  P.kbx = Math.cos(a) * 2.6; P.kby = Math.sin(a) * 2.6;
  G.shake = Math.max(G.shake, 6);
  floater(P.x, P.y - 20, `-${d / 2} ♥`, '#ff7a6a');
  burst(P.x, P.y - 8, '#e0503c', 8, 1);
  sfx('hurt');
  if (def && dmg > d) floater(P.x + 8, P.y - 26, 'blocked', '#9fd2ff');
  if (P.hp <= 0) die();
}
function die() {
  G.deaths++; sfx('die');
  burst(P.x, P.y - 8, '#e0503c', 24, 1.6);
  G.mode = 'dead';
}
function respawn() {
  P.hp = P.maxHp; P.iframes = 90;
  const g = countItem('gold'), lost = Math.floor(g / 4);
  if (lost) removeItem('gold', lost);
  enterMap('over', CAMP.c * TILE + 8, CAMP.r * TILE + 10, true);
  G.mode = 'play';
  if (lost) toast(`You dropped ${lost} gold.`, '#f2d27a');
  save();
}

function damageEnemy(e, dmg, kx, ky) {
  e.hp -= dmg; e.flash = 10;
  const k = e.type === 'boss' ? 0.12 : 1;
  e.kbx = kx * k; e.kby = ky * k;
  floater(e.x, e.y - e.cy - 12, String(dmg), '#ffffff');
  burst(e.x, e.y - e.cy, e.type === 'slime' ? '#7cc463' : e.type === 'bat' ? '#9a68d8' : '#ece6d8', 6, 1.2);
  sfx('hit');
  G.shake = Math.max(G.shake, e.type === 'boss' ? 3 : 2);
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.alive = false;
  const m = curMap();
  burst(e.x, e.y - e.cy, '#ece6d8', 14, 1.4);
  burst(e.x, e.y - e.cy, '#6b6578', 10, 0.8);
  for (const [id, chance, qty] of ENEMY[e.type].drops) if (Math.random() < chance) dropItem(m, id, qty, e.x, e.y);
  if (e.type === 'boss') {
    G.bossDefeated = true; G.shake = 20; sfx('boom');
    burst(e.x, e.y - 14, '#f2d27a', 40, 2.2);
    dropItem(m, 'crown', 1, e.x - 10, e.y);
    dropItem(m, 'gold', 25, e.x + 10, e.y);
    if (!G.heartTaken) dropItem(m, 'heart', 1, e.x, e.y + 8);
    m.enemies.forEach(o => { if (o.type === 'bat') { o.alive = false; burst(o.x, o.y - o.cy, '#9a68d8', 8, 1); } });
    G.victoryAt = G.tick + 120;
  }
}
function dropItem(m, id, qty, x, y) {
  const a = Math.random() * Math.PI * 2;
  m.drops.push({ id, qty, x, y, vx: Math.cos(a) * 0.9, vy: Math.sin(a) * 0.9, z: 0, vz: 2.2, t: 0 });
}

function updateEnemies(m) {
  for (const e of m.enemies) {
    if (!e.alive) continue;
    e.t++;
    if (e.flash > 0) e.flash--;
    if (e.kbx || e.kby) {
      moveBox(m, e, e.kbx, e.kby, e.hw, e.hh, e.fly);
      e.kbx *= 0.8; e.kby *= 0.8;
      if (Math.abs(e.kbx) < 0.05) e.kbx = 0; if (Math.abs(e.kby) < 0.05) e.kby = 0;
    }
    const dx = P.x - e.x, dy = (P.y - 5) - (e.y - e.cy), d = Math.hypot(dx, dy) || 1;
    if (e.type === 'slime') {
      if (e.hop > 0) { e.hop--; moveBox(m, e, e.vx, e.vy, e.hw, e.hh, false); e.vx *= 0.94; e.vy *= 0.94; }
      else if (e.t % (d < 100 ? 48 : 100) === 0) {
        if (d < 100) { e.vx = dx / d * 1.5; e.vy = dy / d * 1.5; }
        else { const a = Math.random() * Math.PI * 2; e.vx = Math.cos(a) * 0.7; e.vy = Math.sin(a) * 0.7; }
        e.hop = 22;
      }
    } else if (e.type === 'bat') {
      const chase = d < 130;
      if (chase) { const px = -dy / d, py = dx / d, wob = Math.sin(e.t * 0.12) * 0.7; e.vx += (dx / d + px * wob) * 0.06; e.vy += (dy / d + py * wob) * 0.06; }
      else { e.vx += (Math.random() - 0.5) * 0.08; e.vy += (Math.random() - 0.5) * 0.08; }
      const sp = Math.hypot(e.vx, e.vy), max = chase ? 1.15 : 0.45;
      if (sp > max) { e.vx *= max / sp; e.vy *= max / sp; }
      const [hx, hy] = moveBox(m, e, e.vx, e.vy, e.hw, e.hh, true);
      if (hx) e.vx *= -1; if (hy) e.vy *= -1;
    } else if (e.type === 'skeleton') {
      e.moving = false;
      if (d < 140) {
        const sp = 0.62, mx = dx / d * sp, my = dy / d * sp;
        const [hx, hy] = moveBox(m, e, mx, my, e.hw, e.hh, false);
        if (hx && !hy) moveBox(m, e, 0, Math.sign(my || 1) * sp, e.hw, e.hh, false);
        if (hy && !hx) moveBox(m, e, Math.sign(mx || 1) * sp, 0, e.hw, e.hh, false);
        e.moving = true; e.face = dx < 0 ? -1 : 1;
      } else {
        if (e.t % 120 === 0) { const a = Math.random() * Math.PI * 2; e.vx = Math.cos(a) * 0.3; e.vy = Math.sin(a) * 0.3; e.st = 40; }
        if (e.st > 0) { e.st--; moveBox(m, e, e.vx, e.vy, e.hw, e.hh, false); e.moving = true; e.face = e.vx < 0 ? -1 : 1; }
      }
    } else if (e.type === 'boss') updateBoss(e, m, dx, dy, d);

    if (P.iframes <= 0 && e.alive) {
      const cd = Math.hypot(P.x - e.x, (P.y - 5) - (e.y - e.cy));
      if (cd < e.r + 5) hurtPlayer(e.dmg, e.x, e.y);
    }
  }
  // Keep enemies from stacking on top of each other
  const es = m.enemies;
  for (let i = 0; i < es.length; i++) for (let j = i + 1; j < es.length; j++) {
    const a = es[i], b = es[j];
    if (!a.alive || !b.alive || a.type === 'boss' || b.type === 'boss') continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r - 2;
    if (d > 0 && d < min) { const push = (min - d) / 2 / d; moveBox(m, a, -dx * push, -dy * push, a.hw, a.hh, a.fly); moveBox(m, b, dx * push, dy * push, b.hw, b.hh, b.fly); }
  }
  m.enemies = m.enemies.filter(e => e.alive);
}

const inRoom = (x, y, R) => x >= R.x * TILE && x < (R.x + R.w) * TILE && y >= R.y * TILE && y < (R.y + R.h) * TILE;
function updateBoss(e, m, dx, dy, d) {
  if (!e.active) {
    if (inRoom(P.x, P.y, ROOMS.boss)) { e.active = true; e.state = 'roar'; e.st = 70; G.shake = 12; sfx('roar'); toast('The Bone King awakens!', '#ff9a7a'); }
    return;
  }
  const phase2 = e.hp <= e.maxHp / 2;
  e.st--;
  const next = (s, t) => { e.state = s; e.st = t; };
  switch (e.state) {
    case 'roar': if (e.st <= 0) next('chase', 120); break;
    case 'chase': {
      const sp = phase2 ? 0.72 : 0.55;
      moveBox(m, e, dx / d * sp, dy / d * sp, e.hw, e.hh, false);
      e.face = dx < 0 ? -1 : 1;
      if (e.st <= 0) {

function updateProjectiles(m) {

/* ── Interaction ── */
function updateFocus(m) {
  const [vx, vy] = DIRV[P.dir];
  const px = P.x + vx * 9, py = P.y - 4 + vy * 9;
  let best = null, bd = 15;
  for (const o of m.objects) {
    if (o.kind === 'walltorch') continue;
    if (o.kind === 'chest' && o.opened) continue;
    const ox = o.c * TILE + 8, oy = o.r * TILE + 10, d = Math.hypot(ox - px, oy - py);
    if (d < bd) { bd = d; best = o; }
  }
  if (best) {
    const label = { chest: 'Open', sign: 'Read', anvil: 'Craft', campfire: 'Rest' }[best.kind]
      || (best.kind === 'node' ? (best.left <= 0 ? 'Regrowing' : { stone: 'Mine', iron: 'Mine iron', coal: 'Mine coal', herb: 'Pick herb' }[best.res]) : '');
    G.focus = { obj: best, label, x: best.c * TILE + 8, y: best.r * TILE };
    return;
  }
  const tr = Math.floor((P.y - 3 + vy * 11) / TILE), tcx = Math.floor((P.x + vx * 10) / TILE);
  const t = getT(m, tcx, tr);
  if (t === T.TREE && m.id === 'over') { G.focus = { tree: [tcx, tr], label: 'Chop', x: tcx * TILE + 8, y: tr * TILE }; return; }
  if (t === T.DOOR) { G.focus = { door: [tcx, tr], label: hasItem('key') ? 'Unlock' : 'Locked', x: tcx * TILE + 8, y: tr * TILE }; return; }
  G.focus = null;
}
function interact(m) {

    if ((m.treeCd.get(key) || 0) > now) { toast('This tree needs time to regrow.'); sfx('deny'); return; }
    const n = Math.random() < 0.4 ? 2 : 1;
    addItem('wood', n); m.treeCd.set(key, now + 60 * 25);
    toast(`+${n} Wood`); sfx('chop'); burst(f.x, f.y + 6, '#4f9a46', 8, 1); burst(f.x, f.y + 10, '#7d5332', 4, 0.8);
    return;
  }
  if (f.door) {
    if (!hasItem('key')) { toast('Locked. The key must be somewhere in the crypt.'); sfx('deny'); return; }
    removeItem('key', 1); openDoor(m, false); toast('The door grinds open.', '#f2d27a'); sfx('door'); G.shake = 6; save();
    return;
  }
  const o = f.obj;
  switch (o.kind) {
    case 'chest': openChest(o); break;
    case 'sign': ui.signText = o.text; G.mode = 'sign'; break;
    case 'anvil': G.mode = 'craft'; break;

/* ════════════════════════════════════════════════════════════════════

function render() {

  ctx.setTransform(UI, 0, 0, UI, 0, 0);
  if (G.mode === 'title') drawTitle();
  else {
    drawHUD(m);
    if (G.mode === 'inv') drawInventory();
    if (G.mode === 'craft') drawCrafting();
    if (G.mode === 'sign') drawSign();
    if (G.mode === 'pause') drawPause();
    if (G.mode === 'dead') drawDead();
    if (G.mode === 'victory') drawVictory();
  }
  if (G.fade) {
    const a = G.fade.t < G.fade.dur ? G.fade.t / G.fade.dur : 2 - G.fade.t / G.fade.dur;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

  }
}

function renderWorld(m, withActors) {
  const sx = G.shake ? (Math.random() - 0.5) * G.shake * ZOOM * 0.6 | 0 : 0;
  const sy = G.shake ? (Math.random() - 0.5) * G.shake * ZOOM * 0.6 | 0 : 0;
  const offX = Math.round(G.cam.x * ZOOM) - sx, offY = Math.round(G.cam.y * ZOOM) - sy;
  G.off.x = offX; G.off.y = offY;

  ctx.fillRect(0, 0, DW, DH);
  ctx.setTransform(ZOOM, 0, 0, ZOOM, -offX, -offY);
  ctx.imageSmoothingEnabled = false;

  const c0 = Math.max(0, Math.floor(G.cam.x / TILE) - 1), r0 = Math.max(0, Math.floor(G.cam.y / TILE) - 1);
  const c1 = Math.min(m.w, Math.ceil((G.cam.x + VW) / TILE) + 1), r1 = Math.min(m.h, Math.ceil((G.cam.y + VH) / TILE) + 1);
  ctx.drawImage(m.canvas, c0 * TILE, r0 * TILE, (c1 - c0) * TILE, (r1 - r0) * TILE, c0 * TILE, r0 * TILE, (c1 - c0) * TILE, (r1 - r0) * TILE);

    for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) {
      if (getT(m, c, r) !== T.WATER) continue;
      const ph = G.tick * 0.03 + hash2(c, r, 9) * 6.28;
      const ox = 2 + ((Math.sin(ph) * 0.5 + 0.5) * 9 | 0), oy = 3 + ((c * 7 + r * 3) % 9);
      ctx.fillRect(c * TILE + ox, r * TILE + oy, 3, 1);
      if (hash2(c, r, 10) > 0.5) ctx.fillRect(c * TILE + ((ox + 6) % 13), r * TILE + ((oy + 6) % 13), 2, 1);
    }
  }

  const vis = (x, y, pad) => x > G.cam.x - pad && x < G.cam.x + VW + pad && y > G.cam.y - pad && y < G.cam.y + VH + pad + 16;
  const list = [];
  for (const o of m.objects) if (vis(o.c * TILE, o.r * TILE, 32)) list.push([o.kind === 'walltorch' ? -1 : o.r * TILE + 13, () => drawObj(o)]);
  for (const d of m.drops) if (vis(d.x, d.y, 16)) list.push([d.y, () => drawDrop(d)]);
  if (withActors) {
    for (const e of m.enemies) if (vis(e.x, e.y, 40)) list.push([e.y, () => drawEnemy(e)]);
    list.push([P.y, drawPlayer]);
  }
  list.sort((a, b) => a[0] - b[0]);
  for (const it of list) it[1]();

  for (const e of m.enemies) if (e.type === 'boss' && e.alive) drawBossTelegraph(e);
  for (const p of m.proj) drawProjectile(p);
  for (const p of G.particles) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }

  if (m.dark) drawLighting(m, offX, offY);
}

function drawObj(o) {
  const x = o.c * TILE, y = o.r * TILE;
  switch (o.kind) {
    case 'chest':
      ctx.drawImage(o.opened ? SPR.chestOpen : SPR.chest, x, y);

    case 'anvil': ctx.drawImage(SPR.anvil, x, y); break;
    case 'sign': ctx.drawImage(SPR.sign, x, y); break;

function drawCampfire(x, y) {

  }

  const id = P.equip.weapon;
  if (id) {

    const cx = P.x + vx * (6 + ext * 7), cy = P.y - 6 + vy * (6 + ext * 7);

  else if (e.type === 'bat') { img = SPR.bat[(e.t / 7 | 0) % 2]; yo = -6 + Math.round(Math.sin(e.t * 0.1) * 2); }
  else if (e.type === 'skeleton') { const fr = e.moving ? ((e.t / 10 | 0) % 2) : 0; img = e.face < 0 ? SPR.skelL[fr] : SPR.skel[fr]; }

}
function drawDead() {
  centerCard('You fell', 'You wake up at the camp fire. You keep your gear.', [['Deaths so far', String(G.deaths)]], 'Enter to wake up');
}
function drawVictory() {
  const mins = Math.floor(G.time / 3600), secs = Math.floor(G.time / 60) % 60;
  centerCard('The Bone King has fallen', 'The Hollow Crypt is quiet again.', [
    ['Time played', `${mins}:${String(secs).padStart(2, '0')}`], ['Deaths', String(G.deaths)], ['Weapon', P.equip.weapon ? ITEMS[P.equip.weapon].name : 'Fists'],
  ], 'Enter to keep exploring');
}
function drawTitle() {
  ctx.fillStyle = 'rgba(8,7,12,0.7)'; ctx.fillRect(0, 0, uiW(), uiH());
  const cx = uiW() / 2, cy = uiH() / 2;
  text('HOLLOW CRYPT', cx + 3, cy - 86, '#16121f', 64, 900, 'center');
  text('HOLLOW CRYPT', cx, cy - 90, C.text, 64, 900, 'center');
  text('Explore, gather, forge your own weapons, and defeat the Bone King.', cx, cy - 46, C.muted, 16, 500, 'center');
  const opts = G.saveExists ? ['Continue', 'New game'] : ['New game'];
  opts.forEach((o, i) => {
    const sel = i === G.titleSel, y = cy + 6 + i * 52, w = 240;
    box(cx - w / 2, y, w, 42, sel ? C.slotSel : 'rgba(21,18,29,0.85)', sel ? C.sel : C.border, 2);
    text(o, cx, y + 22, sel ? C.text : C.muted, 18, 700, 'center', 'middle');
  });
  text('Enter to start · ↑ ↓ to choose', cx, cy + 40 + opts.length * 52, C.muted, 13, 500, 'center');
  text('WASD move · J attack · K bow · E use · Q heal · I bag · C craft', cx, uiH() - 24, 'rgba(236,230,216,0.6)', 12, 500, 'center');
}

/* ════════════════════════════════════════════════════════════════════
   MAIN LOOP
════════════════════════════════════════════════════════════════════ */
let acc = 0, last = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - (last || ts)) / 1000);
  last = ts; acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { tick(); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  render();
  requestAnimationFrame(frame);
}

resize();
buildSprites();
buildWorld();
G.saveExists = !!readSave();
G.map = 'over';
P.x = CAMP.c * TILE; P.y = CAMP.r * TILE;
requestAnimationFrame(frame);
</script>
</body>
