/* ════════════════════════════════════════════════════════════════════
   CANVAS & SCALING — device-pixel canvas, integer world zoom
════════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DW = 0, DH = 0, ZOOM = 3, VW = 0, VH = 0, UI = 1;
let lightCanvas = document.createElement('canvas');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  DW = Math.max(320, Math.floor(innerWidth * dpr));
  DH = Math.max(240, Math.floor(innerHeight * dpr));
  canvas.width = DW; canvas.height = DH;
  lightCanvas.width = DW; lightCanvas.height = DH;
  // Whole-number zoom that shows about 22×13 tiles, but never fewer than 15×9 on small screens
  let z = Math.max(1, Math.round(Math.min(DW / (TILE * 22), DH / (TILE * 13))));
  while (z > 1 && (DW / (z * TILE) < 15 || DH / (z * TILE) < 9)) z--;
  ZOOM = z;
  VW = DW / ZOOM; VH = DH / ZOOM;
  UI = Math.max(0.5, Math.max(1, Math.min(DW / 1280, DH / 720)) * SET.ui);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

/* ════════════════════════════════════════════════════════════════════
   ASSETS — everything is drawn from the craftpix packs in rpg/assets/
════════════════════════════════════════════════════════════════════ */
const ASSET = {

  hunt: 'assets/craftpix-net-789196-free-top-down-hunt-animals-pixel-sprite-pack/PNG/With_Shadow/',
  rock: 'assets/craftpix-net-974061-free-rocks-and-stones-top-down-pixel-art/PNG/Objects_separately/',
  ui:   'assets/craftpix-net-255216-free-basic-pixel-art-ui-for-rpg/PNG/',
  // Pixel-art strips made from the water effects pack by rpg/tools/pixelize_water.py
  gen:  'assets/generated/',
};
// Fortress-kit characters (32×32 frames, facing right) and the animation files each one uses
const CHARS = {
  hero:   { n: 8, anims: { idle: 'Idle', walk: 'Walk', atk: 'Attack_1', thrust: 'Attack_2', dead: 'Dead' } },
  guard:  { n: 9, anims: { idle: 'Idle', walk: 'Walk', atk: 'Attack_1', dead: 'Dead' } },

  spear:  { n: 5, anims: { idle: 'Idle', walk: 'Run', dash: 'Run+Attack', dead: 'Dead' } },

  warden: { n: 6, anims: { idle: 'Idle' } },
  scout:  { n: 7, anims: { idle: 'Idle' } },
  merchant: { n: 2, anims: { idle: 'Idle' } },
  fallen: { n: 1, anims: { dead: 'Dead' } },
};
// Hunt-pack animals (32×32 frames, rows: down, up, left, right)
const ANIMALS = {
  boar:   { dir: 'Boar',         anims: { idle: 'Idle', walk: 'Walk', run: 'Run', atk: 'Attack', dead: 'Death' } },
  fox:    { dir: 'Fox',          anims: { idle: 'Idle', walk: 'walk', run: 'Run', dead: 'Death' } },
  hare:   { dir: 'Hare',         anims: { idle: 'Idle', walk: 'Walk', run: 'Run', dead: 'Death' } },
  deer:   { dir: 'Deer',         anims: { idle: 'Idle', walk: 'Walk', run: 'Run', dead: 'Death' } },
  grouse: { dir: 'Black_grouse', anims: { idle: 'Flight', walk: 'Flight', dead: 'Death' } },
};
const ROW = { down: 0, up: 1, left: 2, right: 3 };

const IMG = {};
function loadAssets() {
  const list = {
    tiles: ASSET.fort + 'Tileset/Tiled_Map.png', chest: ASSET.fort + 'Tileset/Chest.png', meat: ASSET.fort + 'Tileset/Meat.png',
    torch: ASSET.fort + 'Tileset/Torch.png', gate: ASSET.fort + 'Tileset/Gate.png', ui: ASSET.fort + 'UI/UI.png',
    uiIcons: ASSET.ui + 'Icons.png', uiTiles: ASSET.ui + 'Main_tiles.png', uiButtons: ASSET.ui + 'Buttons.png', uiInv: ASSET.ui + 'Inventory.png',
    wRipple: ASSET.gen + 'water_ripple.png', wSplash: ASSET.gen + 'water_splash.png', wWhirl: ASSET.gen + 'water_whirlpool.png',
    knife: ASSET.fort + 'Characters/Knife.png', bolt: ASSET.fort + 'Characters/Charge_1.png', bolt2: ASSET.fort + 'Characters/Charge_2.png',
  };
  for (const k in CHARS) for (const a in CHARS[k].anims) list[`${k}.${a}`] = `${ASSET.fort}Characters/Character_${CHARS[k].n}/${CHARS[k].anims[a]}.png`;
  for (const k in ANIMALS) for (const a in ANIMALS[k].anims) { const d = ANIMALS[k].dir; list[`${k}.${a}`] = `${ASSET.hunt}${d}/${d}_${ANIMALS[k].anims[a]}_with_shadow.png`; }
  for (let i = 1; i <= 8; i++) for (let v = 1; v <= 5; v++) list[`rock${i}_${v}`] = `${ASSET.rock}Rock${i}_${v}.png`;
  list.rockWater = ASSET.rock + 'Rock7_water_shadow_dark3.png';
  list.rockWaterS = ASSET.rock + 'Rock7_water_shadow_dark4.png';
  return Promise.all(Object.entries(list).map(([k, src]) => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; res(); };
    im.onerror = () => { console.warn('Missing asset:', src); IMG[k] = null; res(); };
    im.src = src;
  })));
}

function newCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
function crop(img, x, y, w, h) {
  const [c, g] = newCanvas(w, h);
  if (img) g.drawImage(img, x, y, w, h, 0, 0, w, h);
  return c;
}
function strip(img, fw, fh, row) {
  if (!img) return [newCanvas(fw, fh)[0]];
  const n = Math.max(1, Math.floor(img.width / fw));
  return Array.from({ length: n }, (_, i) => crop(img, i * fw, (row || 0) * fh, fw, fh));
}
function flipX(src) {
  const [c, g] = newCanvas(src.width, src.height);
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
// Quarter-turn rotation with canvas transforms (no getImageData, so it also works from file://)
function rot90(src, q) {
  q = ((q % 4) + 4) % 4;
  if (q === 0) return src;
  const [c, g] = newCanvas(q % 2 ? src.height : src.width, q % 2 ? src.width : src.height);
  g.translate(c.width / 2, c.height / 2); g.rotate(q * Math.PI / 2); g.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}
// Flat colour fill of a sprite's shape (for the white UI glyphs)
function tint(src, col) {
  const [c, g] = newCanvas(src.width, src.height);
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in';
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// Darken / colour-grade a sprite while keeping its alpha
function shade(src, col) {
  const [c, g] = newCanvas(src.width, src.height);
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'multiply';
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(src, 0, 0);
  return c;
}
// Tinted glyph with a 1px dark outline so it reads on any background
function glyph(src, col, outline) {
  const [c, g] = newCanvas(src.width + 2, src.height + 2);
  const o = tint(src, outline || '#16121f');
  for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2], [0, 0], [2, 2], [0, 2], [2, 0]]) g.drawImage(o, dx, dy);
  g.drawImage(tint(src, col), 1, 1);
  return c;
}
// Trim transparent borders (icons are centred by size)
function trim(src) {
  const g = src.getContext('2d');
  let d;
  try { d = g.getImageData(0, 0, src.width, src.height).data; } catch (e) { return src; }
  let x0 = src.width, y0 = src.height, x1 = -1, y1 = -1;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) if (d[(y * src.width + x) * 4 + 3]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return x1 < 0 ? src : crop(src, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
}
const whiteCache = new Map();
function white(src) {
  let c = whiteCache.get(src);
  if (!c) { c = tint(src, '#ffffff'); whiteCache.set(src, c); }
  return c;
}

const SPR = {};
const ICON = {};
const TL = {};
function buildSprites() {
  const TS = IMG.tiles, t = (x, y, w, h) => crop(TS, x, y, w, h);

  // Characters: SPR.ch[name].R / .L → { anim: [frames] }
  SPR.ch = {};
  for (const k in CHARS) {
    const R = {}, L = {};
    for (const a in CHARS[k].anims) { R[a] = strip(IMG[`${k}.${a}`], 32, 32); L[a] = R[a].map(flipX); }
    SPR.ch[k] = { R, L };
  }
  // Animals: SPR.an[name][anim][row] → [frames]
  SPR.an = {};
  for (const k in ANIMALS) {
    SPR.an[k] = {};
    for (const a in ANIMALS[k].anims) SPR.an[k][a] = [0, 1, 2, 3].map(r => strip(IMG[`${k}.${a}`], 32, 32, r));
  }
  // Fox_Run.png stores right before left (every other sheet is left, right), so swap them back
  { const run = SPR.an.fox.run; SPR.an.fox.run = [run[0], run[1], run[3], run[2]]; }

  // World objects
  SPR.chest = strip(IMG.chest, 32, 32);
  SPR.chestL = SPR.chest.map(flipX);
  SPR.roast = strip(IMG.meat, 32, 32);
  SPR.torch = strip(IMG.torch, 16, 16);
  SPR.gate = strip(IMG.gate, 80, 80);
  SPR.knife = strip(IMG.knife, 16, 16);
  const bolt = IMG.bolt ? crop(IMG.bolt, 0, 0, IMG.bolt.width, IMG.bolt.height) : newCanvas(15, 16)[0];
  SPR.bolt = { left: bolt, right: flipX(bolt), up: rot90(bolt, 1), down: rot90(bolt, 3) };
  const diag = IMG.bolt2 ? crop(IMG.bolt2, 0, 0, IMG.bolt2.width, IMG.bolt2.height) : bolt;   // points down-left
  // index = 45° step clockwise from "right": right, down-right, down, down-left, left, up-left, up, up-right
  SPR.bolt8 = [SPR.bolt.right, rot90(diag, 3), SPR.bolt.down, diag, bolt, rot90(diag, 1), SPR.bolt.up, rot90(diag, 2)];
  // Trees, trimmed so the trunk base is the bottom row of each sprite
  SPR.tree = { oak: trim(t(160, 49, 32, 45)), oakM: trim(t(193, 65, 30, 31)), pine: trim(t(241, 48, 31, 48)), pineS: trim(t(272, 64, 16, 32)), small: trim(t(224, 72, 16, 23)) };
  SPR.flowers = [t(212, 164, 9, 9), t(227, 164, 9, 7), t(245, 166, 5, 4), t(257, 163, 13, 10)];

function mulberry32(a) {

      m.objects.push({ kind: 'stump', c, r, stage, at: G.tick + rem });

  PAD.on = true;

function playAction(a, src) {

    case 'dodge':  input.dodge = true; break;
    case 'interact': input.interact = true; break;

function tick() {

  }
  for (const t of G.toasts) t.t--;
  G.toasts = G.toasts.filter(t => t.t > 0);
  if (G.banner && --G.banner.t <= 0) G.banner = null;
  if (G.area && --G.area.t <= 0) G.area = null;
  if (ui.craftFlash) ui.craftFlash--;

  if (G.mode === 'title') { G.cam.x = 260 + Math.sin(G.tick / 900) * 200; G.cam.y = 600 + Math.cos(G.tick / 1100) * 140; return; }
  if (G.mode !== 'play') { updateFx(); return; }
  // Hit-stop: the world freezes for a few frames when a blow lands
  if (G.hitstop > 0) { G.hitstop--; return; }

  const m = curMap();
  updateEnemies(m);
  updateProjectiles(m);
  updateDrops(m);
  updateNodes(m);
  updateCorpses(m);
  updateWater(m);
  updateTraps(m);
  updateNight(m);
  updateFx();
  updateFocus(m);
  updateCamera(false);
  if (m.dark) exploreAround(m);
  if (G.victoryAt && G.tick >= G.victoryAt) { G.victoryAt = 0; G.mode = 'victory'; save(); }
  if (G.time % 1800 === 0) save();

function updatePlayer() {

    else { const d = G.maps.depths; enterMap('depths', d.start.c * TILE + 8, (d.start.r + 1) * TILE + 10, true); P.dir = 'down'; }

/* ── Talking: quests and the shop ── */

const SHOP_BUY = [['arrows', 10, 6], ['bandage', 1, 3], ['roast', 1, 6], ['torch', 1, 5], ['iron', 1, 4], ['coal', 1, 3], ['pickaxe', 1, 10]];

function shopList() {

const TREE_CHOPS = 3;

/* ── Day and night: an 8-minute day, starting at 6:00 ── */
const DAY_LEN = 60 * 60 * 8;

  const h = hourOfDay();
  if (h >= 7 && h < 18) return 0;
  if (h >= 18 && h < 20) return (h - 18) / 2;
  if (h >= 5 && h < 7) return 1 - (h - 5) / 2;
  return 1;
}
const isNight = () => darkness() > 0.5;
function clockText() {
  const h = hourOfDay(), hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 10) * 10;
  return `Day ${Math.floor(G.time / DAY_LEN) + 1} · ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}${isNight() ? ' · night' : ''}`;
}
// Sleeping at the fire skips to 7:00 the next morning
function sleepUntilMorning() {
  const t7 = DAY_LEN / 24, base = Math.floor(G.time / DAY_LEN) * DAY_LEN;
  G.time = hourOfDay() < 7 ? base + t7 : base + DAY_LEN + t7;
}
// At nightfall a pack of foxes comes out of the woods, somewhere out of sight
function updateNight(m) {

  const night = isNight();
  if (night && !G.nightPack) {
    G.nightPack = true;
    let n = 0;
    for (let i = 0; i < 300 && n < 4; i++) {

function updateCamera(snap) {

  tx = mw <= VW ? (mw - VW) / 2 : Math.max(0, Math.min(mw - VW, tx));

  else { G.cam.x += (tx - G.cam.x) * 0.2; G.cam.y += (ty - G.cam.y) * 0.2; }

/* ════════════════════════════════════════════════════════════════════
   RENDER — WORLD
════════════════════════════════════════════════════════════════════ */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const m = curMap();
  if (m) renderWorld(m, G.mode !== 'title');
  else { ctx.fillStyle = '#0b0a10'; ctx.fillRect(0, 0, DW, DH); }
  ctx.setTransform(UI, 0, 0, UI, 0, 0);
  HITS = [];
  if (G.mode === 'title') drawTitle();
  else {
    drawHUD(m);
    if (G.mode === 'inv') drawInventory();
    if (G.mode === 'craft') drawCrafting();
    if (G.mode === 'sign') drawSign();
    if (G.mode === 'pause') drawPause();
    if (G.mode === 'options') drawOptions();
    if (G.mode === 'shop') drawShop();
    if (G.mode === 'dead') drawDead();
    if (G.mode === 'victory') drawVictory();
  }
  if (G.fade) {
    const a = G.fade.t < G.fade.dur ? G.fade.t / G.fade.dur : 2 - G.fade.t / G.fade.dur;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = `rgba(8,7,12,${Math.max(0, Math.min(1, a))})`; ctx.fillRect(0, 0, DW, DH);
  }
}

function renderWorld(m, withActors) {
  const sx = G.shake ? (Math.random() - 0.5) * G.shake * ZOOM * 0.6 | 0 : 0;
  const sy = G.shake ? (Math.random() - 0.5) * G.shake * ZOOM * 0.6 | 0 : 0;
  const offX = Math.round(G.cam.x * ZOOM) - sx, offY = Math.round(G.cam.y * ZOOM) - sy;
  G.off.x = offX; G.off.y = offY;
  ctx.fillStyle = m.dark ? '#07060b' : '#21482a';
  ctx.fillRect(0, 0, DW, DH);
  ctx.setTransform(ZOOM, 0, 0, ZOOM, -offX, -offY);
  ctx.imageSmoothingEnabled = false;

  const c0 = Math.max(0, Math.floor(G.cam.x / TILE) - 1), r0 = Math.max(0, Math.floor(G.cam.y / TILE) - 1);
  const c1 = Math.min(m.w, Math.ceil((G.cam.x + VW) / TILE) + 1), r1 = Math.min(m.h, Math.ceil((G.cam.y + VH) / TILE) + 1);
  ctx.drawImage(m.canvas, c0 * TILE, r0 * TILE, (c1 - c0) * TILE, (r1 - r0) * TILE, c0 * TILE, r0 * TILE, (c1 - c0) * TILE, (r1 - r0) * TILE);

  // Water effects: the whirlpool and ripples / splashes, under everything that stands on the ground
  if (m.whirl) { const f = anim(SPR.wWhirl, G.tick, 6); ctx.drawImage(f, m.whirl.c * TILE + 8 - (f.width >> 1), m.whirl.r * TILE + 8 - (f.height >> 1)); }

    for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) {
      if (getT(m, c, r) !== T.WATER) continue;
      const ph = G.tick * 0.03 + hash2(c, r, 9) * 6.28;
      const ox = 2 + ((Math.sin(ph) * 0.5 + 0.5) * 9 | 0), oy = 3 + ((c * 7 + r * 3) % 9);
      ctx.fillRect(c * TILE + ox, r * TILE + oy, 3, 1);
      if (hash2(c, r, 10) > 0.5) ctx.fillRect(c * TILE + ((ox + 6) % 13), r * TILE + ((oy + 6) % 13), 2, 1);
    }
  }

  const vis = (x, y, pad) => x > G.cam.x - pad && x < G.cam.x + VW + pad && y > G.cam.y - pad && y < G.cam.y + VH + pad + 16;
  const list = [];
  const objKey = o => o.kind === 'walltorch' || o.kind === 'trap' ? -1 : o.kind === 'gate' ? (o.r + 3) * TILE : o.kind === 'arch' ? o.r * TILE + 15 : o.r * TILE + 13;
  for (const o of m.objects) if (vis(o.c * TILE, o.r * TILE, 48)) list.push([objKey(o), () => drawObj(o)]);

  for (const d of m.drops) if (vis(d.x, d.y, 16)) list.push([d.y, () => drawDrop(d)]);
  if (withActors) {
    if (m.corpses) for (const c of m.corpses) if (vis(c.e.x, c.e.y, 40)) list.push([c.e.y - 2, () => drawCorpse(c)]);
    for (const e of m.enemies) if (vis(e.x, e.y, 48)) list.push([e.y, () => drawEnemy(e)]);
    list.push([P.y, drawPlayer]);
  }
  list.sort((a, b) => a[0] - b[0]);
  for (const it of list) it[1]();

  for (const e of m.enemies) if (e.type === 'boss' && e.alive) drawBossTelegraph(e);
  for (const e of m.enemies) if (e.aim > 0 && e.alive) drawAimLine(e);
  if (withActors && G.mode === 'play' && G.inputMode !== 'mouse' && hasItem('bow') && hasItem('arrows') && !(PAD.on && Math.hypot(PAD.ax, PAD.ay) > 0.4)) drawTargetMark(bowTarget());
  for (const p of m.proj) drawProjectile(p);
  for (const p of G.particles) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }

  if (m.dark) drawLighting(m, offX, offY, 0.94, '6,5,12');
  else {
    const dk = darkness(), h = hourOfDay();
    // warm light at dusk and dawn

    if (warm > 0.01) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,130,60,${0.12 * Math.min(1, warm)})`; ctx.fillRect(0, 0, DW, DH); ctx.restore(); }
    if (dk > 0.01) drawLighting(m, offX, offY, 0.72 * dk, '10,12,34');

}

const anim = (frames, t, speed) => frames[((t / speed) | 0) % frames.length];

function drawAt(img, x, y) {

    }, () => { if (!ui.rebind) ui.optSel = i; });
  }
  text('↑ ↓ choose · ← → change · Enter select / rebind · Esc back', X + W / 2, Y + H - 22, C.muted, 12, 500, 'center');
}
function drawDead() {
  centerCard('You fell', 'You wake up at the camp fire. You keep your gear.', [['Deaths so far', String(G.deaths)]], 'Enter to wake up');
}
function drawVictory() {
  const mins = Math.floor(G.time / 3600), secs = Math.floor(G.time / 60) % 60;
  centerCard('The Hollow King has fallen', 'A stairway has opened beneath his throne…', [
    ['Time played', `${mins}:${String(secs).padStart(2, '0')}`], ['Deaths', String(G.deaths)], ['Weapon', P.equip.weapon ? ITEMS[P.equip.weapon].name : 'Fists'],
  ], 'Enter to keep exploring');
}
function drawTitle() {
  ctx.fillStyle = 'rgba(8,7,12,0.7)'; ctx.fillRect(0, 0, uiW(), uiH());
  const cx = uiW() / 2, cy = uiH() / 2;
  text('HOLLOW CRYPT', cx + 3, cy - 86, '#16121f', 64, 900, 'center');
  text('HOLLOW CRYPT', cx, cy - 90, LT.text, 64, 900, 'center');
  text('Explore, gather, forge your own weapons, and defeat the Hollow King.', cx, cy - 46, LT.muted, 16, 500, 'center');
  const opts = G.saveExists ? ['Continue', 'New game'] : ['New game'];
  opts.forEach((o, i) => {
    const sel = i === G.titleSel, y = cy + 6 + i * 52, w = 240;
    button(cx - w / 2, y, w, 42, '', sel);
    hit(cx - w / 2, y, w, 42, () => { G.titleSel = i; startFromTitle(); }, () => { G.titleSel = i; });
    text(o, cx, y + 22, '#1d3a26', 18, 700, 'center', 'middle');
  });
  text('Enter, A or click to start · ↑ ↓ to choose', cx, cy + 40 + opts.length * 52, LT.muted, 13, 500, 'center');
  text('Keyboard, mouse or gamepad · WASD move · J / left click attack · K / right click crossbow · Shift roll · E use', cx, uiH() - 24, 'rgba(236,230,216,0.6)', 12, 500, 'center');
}

/* ════════════════════════════════════════════════════════════════════
   MAIN LOOP
════════════════════════════════════════════════════════════════════ */
let acc = 0, last = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - (last || ts)) / 1000);
  last = ts; acc += dt;
  let n = 0;
  pollPad();
  musicTick();
  while (acc >= STEP && n < 6) { tick(); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  render();
  const cur = G.mode === 'play' && G.inputMode === 'mouse' ? 'crosshair' : 'default';
  if (canvas.style.cursor !== cur) canvas.style.cursor = cur;
  requestAnimationFrame(frame);
}

loadSettings();
resize();
ctx.fillStyle = '#0b0a10'; ctx.fillRect(0, 0, DW, DH);
ctx.fillStyle = '#a9a1bf'; ctx.font = `600 ${Math.round(16 * UI)}px ${FONT}`; ctx.textAlign = 'center';
ctx.fillText('Loading…', DW / 2, DH / 2);
loadAssets().then(() => {
  buildSprites();
  buildWorld();
  G.saveExists = !!readSave();
  G.map = 'over';
  P.x = CAMP.c * TILE; P.y = CAMP.r * TILE;
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
